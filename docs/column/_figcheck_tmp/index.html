<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<title>図の確認（一時）</title>
<!-- favicon:auto -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="canonical" href="https://keiri-tools.com/column/_figcheck_tmp/">
<meta name="robots" content="noindex,follow">
<link rel="stylesheet" href="../../assets/style.css">
</head><body><main><article>
<figure class="figure">
    <svg viewBox="0 0 900 250" role="img" aria-label="対象になる事業場は、令和7年度の地域別最低賃金以上・令和8年度の地域別最低賃金未満という帯の中にある">
      <text x="20" y="30" font-size="14" fill="currentColor" font-weight="bold">事業場内最低賃金（事業場でいちばん低い時給）</text>

      <rect x="60" y="70" width="200" height="60" fill="none" stroke="var(--warn-line)" stroke-width="1.5" stroke-dasharray="5 4"/>
      <rect x="260" y="70" width="330" height="60" fill="var(--accent)" fill-opacity="0.15" stroke="var(--accent)" stroke-width="2"/>
      <rect x="590" y="70" width="250" height="60" fill="none" stroke="var(--sub)" stroke-width="1.5" stroke-dasharray="5 4"/>

      <text x="160" y="95" font-size="13" fill="currentColor" text-anchor="middle">対象外</text>
      <text x="160" y="116" font-size="12" fill="currentColor" text-anchor="middle">最低賃金法違反の状態</text>

      <text x="425" y="95" font-size="13" fill="currentColor" text-anchor="middle" font-weight="bold">ここだけが対象</text>
      <text x="425" y="116" font-size="12" fill="currentColor" text-anchor="middle">交付要綱 別表第1 第1欄</text>

      <text x="715" y="95" font-size="13" fill="currentColor" text-anchor="middle">対象外</text>
      <text x="715" y="116" font-size="12" fill="currentColor" text-anchor="middle">すでに今年度の額に達している</text>

      <line x1="60" y1="160" x2="860" y2="160" stroke="currentColor" stroke-width="1.5"/>
      <polygon points="860,160 850,155 850,165" fill="currentColor"/>
      <text x="845" y="182" font-size="12" fill="currentColor" text-anchor="end">時給が高い →</text>

      <line x1="260" y1="70" x2="260" y2="170" stroke="var(--accent)" stroke-width="1.5"/>
      <line x1="590" y1="70" x2="590" y2="170" stroke="var(--accent)" stroke-width="1.5"/>
      <text x="260" y="205" font-size="12" fill="currentColor" text-anchor="middle">令和7年度の</text>
      <text x="260" y="222" font-size="12" fill="currentColor" text-anchor="middle">地域別最低賃金（以上）</text>
      <text x="590" y="205" font-size="12" fill="currentColor" text-anchor="middle">令和8年度の</text>
      <text x="590" y="222" font-size="12" fill="currentColor" text-anchor="middle">地域別最低賃金（未満）</text>
    </svg>
    <figcaption>対象事業場は帯で決まる。地域別最低賃金は都道府県ごとに額が違うので、この帯の位置も幅も都道府県ごとに違う。</figcaption>
  </figure>
<hr>
<figure class="figure">
    <svg viewBox="0 0 900 300" role="img" aria-label="令和8年度の業務改善助成金の時系列。9月1日の受付開始から交付決定、賃金引上げ、設備投資、事業完了までの順序">
      <text x="20" y="26" font-size="14" fill="currentColor" font-weight="bold">令和8年度の順序 — 上から順に、どれが先で どれが後か</text>

      <rect x="90" y="50" width="310" height="30" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="1.5"/>
      <text x="245" y="70" font-size="12" fill="currentColor" text-anchor="middle">① 交付申請できる期間</text>
      <line x1="400" y1="42" x2="400" y2="88" stroke="var(--warn-line)" stroke-width="2"/>
      <text x="410" y="70" font-size="11" fill="currentColor" text-anchor="start">← 申請の締切（発効日の前日か11/30の早い日）</text>

      <rect x="90" y="95" width="410" height="30" fill="var(--accent)" fill-opacity="0.10" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="245" y="115" font-size="12" fill="currentColor" text-anchor="middle">② 賃金引上げ（申請より後・1回で）</text>
      <line x1="500" y1="90" x2="500" y2="133" stroke="var(--warn-line)" stroke-width="2"/>
      <text x="510" y="115" font-size="11" fill="currentColor" text-anchor="start">← 賃金引上げの締切（発効日の前日）</text>

      <rect x="300" y="140" width="420" height="30" fill="var(--sub)" fill-opacity="0.18" stroke="var(--sub)" stroke-width="1.5"/>
      <text x="510" y="160" font-size="12" fill="currentColor" text-anchor="middle">③ 設備投資・支払（交付決定より後）</text>

      <line x1="90" y1="205" x2="860" y2="205" stroke="currentColor" stroke-width="1.5"/>
      <polygon points="860,205 850,200 850,210" fill="currentColor"/>

      <line x1="90" y1="50" x2="90" y2="212" stroke="var(--accent)" stroke-width="1.5"/>
      <line x1="300" y1="140" x2="300" y2="212" stroke="var(--sub)" stroke-width="1.5"/>
      <line x1="720" y1="140" x2="720" y2="212" stroke="var(--sub)" stroke-width="1.5"/>

      <text x="90" y="228" font-size="12" fill="currentColor" text-anchor="middle">9/1</text>
      <text x="90" y="245" font-size="11" fill="currentColor" text-anchor="middle">受付開始</text>
      <text x="300" y="228" font-size="12" fill="currentColor" text-anchor="middle">交付決定</text>
      <text x="720" y="228" font-size="12" fill="currentColor" text-anchor="middle">1/31</text>
      <text x="720" y="245" font-size="11" fill="currentColor" text-anchor="middle">事業完了期限</text>
    </svg>
    <figcaption>申請の締切（①の右端）と賃金引上げの締切（②の右端）は同じではない。発効日が11月30日より後にずれた都道府県だけ、この2本が離れる。</figcaption>
  </figure>
</article></main></body></html>
