<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<!-- favicon:auto -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="../../assets/style.css"><script src="../../assets/track.js" defer></script>
</head><body><main><article><figure class="figure">
    <svg viewBox="0 0 760 330" role="img" aria-label="1年間に払った損害保険料を4つに切り分けた図。火災部分の保険料は対象外、地震等損害部分のうち臨時費用・取壊し費用にあたる部分は施行令213条1号で対象外、地震部分の保険金額が火災部分の20%未満なら施行令213条2号で対象外、残った部分だけが地震保険料控除の対象になる">
      <text x="10" y="22" font-size="14" font-weight="bold" fill="currentColor">1年間に払った損害保険料は、4つに切り分けられる</text>

      <rect x="20" y="45" width="720" height="34" fill="none" stroke="currentColor" stroke-width="1"/>
      <text x="380" y="67" font-size="13" text-anchor="middle" fill="currentColor">1年間に払った保険料の総額（控除証明書が届く前の、あなたが払った全額）</text>

      <rect x="20" y="105" width="300" height="46" fill="none" stroke="var(--sub)" stroke-width="1"/>
      <text x="170" y="124" font-size="13" text-anchor="middle" fill="currentColor">火災部分の保険料</text>
      <text x="170" y="142" font-size="12" text-anchor="middle" fill="var(--sub)">対象外（77条1項は地震等損害部分に限る）</text>

      <rect x="330" y="105" width="410" height="46" fill="none" stroke="var(--accent)" stroke-width="2"/>
      <text x="535" y="124" font-size="13" text-anchor="middle" fill="currentColor">地震等損害部分の保険料</text>
      <text x="535" y="142" font-size="12" text-anchor="middle" fill="var(--sub)">ここから、さらに政令が2種類を外す</text>

      <rect x="330" y="185" width="130" height="60" fill="none" stroke="var(--warn-line)" stroke-width="1"/>
      <text x="395" y="205" font-size="12" text-anchor="middle" fill="currentColor">臨時費用・</text>
      <text x="395" y="221" font-size="12" text-anchor="middle" fill="currentColor">取壊し費用の分</text>
      <text x="395" y="238" font-size="12" text-anchor="middle" fill="var(--sub)">213条1号で対象外</text>

      <rect x="470" y="185" width="130" height="60" fill="none" stroke="var(--warn-line)" stroke-width="1"/>
      <text x="535" y="205" font-size="12" text-anchor="middle" fill="currentColor">地震部分が火災の</text>
      <text x="535" y="221" font-size="12" text-anchor="middle" fill="currentColor">20%未満のとき</text>
      <text x="535" y="238" font-size="12" text-anchor="middle" fill="var(--sub)">213条2号で全部対象外</text>

      <rect x="610" y="185" width="130" height="60" fill="none" stroke="var(--accent)" stroke-width="2"/>
      <text x="675" y="205" font-size="12" text-anchor="middle" fill="currentColor">残った部分</text>
      <text x="675" y="221" font-size="12" text-anchor="middle" fill="currentColor">＝「地震保険料」</text>
      <text x="675" y="238" font-size="12" text-anchor="middle" fill="var(--sub)">これが控除の対象</text>

      <text x="20" y="285" font-size="13" fill="currentColor">控除証明書に書かれているのは、いちばん右の「残った部分」の金額です。</text>
      <text x="20" y="307" font-size="13" fill="currentColor">払った額と証明書の額が違うのは、条文が上の順で削っているからです。</text>
    </svg>
    <figcaption>所得税法77条1項と所得税法施行令213条による、控除対象部分の切り分け</figcaption>
  </figure>
<figure class="figure">
    <svg viewBox="0 0 760 320" role="img" aria-label="建物の火災保険金額を横軸にとった図。約1億6667万円までは地震保険金額が火災保険金額の30から50パーセントの帯に収まり、それを超えると政令の上限5000万円に張り付いて比率が下がる。2億5000万円で比率がちょうど20パーセントになり、それより右では20パーセントを割るが、地震保険金額が政令の金額に等しいのでかっこ書きにより除外されない">
      <text x="10" y="22" font-size="14" font-weight="bold" fill="currentColor">火災保険金額が大きいほど、地震÷火災の比率は下がる（上限5,000万円が効くため）</text>

      <line x1="70" y1="200" x2="720" y2="200" stroke="currentColor" stroke-width="1"/>
      <text x="80" y="222" font-size="12" text-anchor="middle" fill="var(--sub)">1,000万</text>
      <text x="290" y="222" font-size="12" text-anchor="middle" fill="var(--sub)">1億6,667万</text>
      <text x="510" y="222" font-size="12" text-anchor="middle" fill="var(--sub)">2億5,000万</text>
      <text x="700" y="222" font-size="12" text-anchor="middle" fill="var(--sub)">3億</text>

      <line x1="70" y1="90" x2="290" y2="90" stroke="var(--accent)" stroke-width="3"/>
      <line x1="290" y1="90" x2="510" y2="140" stroke="var(--accent)" stroke-width="3"/>
      <line x1="510" y1="140" x2="700" y2="168" stroke="var(--warn-line)" stroke-width="3"/>

      <line x1="290" y1="96" x2="290" y2="200" stroke="var(--sub)" stroke-width="1" stroke-dasharray="5 4"/>
      <line x1="510" y1="146" x2="510" y2="200" stroke="var(--warn-line)" stroke-width="1" stroke-dasharray="5 4"/>

      <text x="170" y="78" font-size="12" text-anchor="middle" fill="currentColor">比率 30〜50%</text>
      <text x="512" y="122" font-size="12" text-anchor="middle" fill="currentColor">ここで比率がちょうど20%</text>

      <text x="20" y="258" font-size="12" fill="currentColor">左の平らな部分 … 地震保険金額が上限5,000万円に届いていない。比率は30〜50%</text>
      <text x="20" y="278" font-size="12" fill="currentColor">1億6,667万円から右 … 上限に張り付き、火災保険金額が増えるほど比率だけが下がる</text>
      <text x="20" y="298" font-size="12" fill="currentColor">2億5,000万円から右 … 比率は20%未満。ただし地震金額＝政令の金額なので213条2号から除かれる</text>
    </svg>
    <figcaption>地震保険に関する法律2条2項4号・同法施行令2条と、所得税法施行令213条2号の関係</figcaption>
  </figure></article></main></body></html>
