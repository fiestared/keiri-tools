<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<title>図の確認（一時）</title>
<!-- favicon:auto -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="canonical" href="https://keiri-tools.com/column/_figcheck_kkk/">
<meta name="robots" content="noindex,follow">
<link rel="stylesheet" href="../../assets/style.css">
</head><body><main><article style="padding:16px"><figure class="figure fig-wide" style="--figw:640px">
  <svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="子ども・子育て拠出金は政府が一般事業主から直接徴収し、被保険者は関与しない。子ども・子育て支援納付金は政府が健康保険者等から徴収し、その健康保険者等が被保険者と事業主から保険料として集める二段構えになっている">
    <!-- 左: 拠出金 -->
    <rect class="fg-box" x="10" y="16" width="290" height="272" rx="8"/>
    <text class="fg-lb" x="155" y="40" text-anchor="middle">子ども・子育て拠出金</text>
    <text class="fg-s" x="155" y="58" text-anchor="middle">支援法69条〜71条（第二節）</text>

    <rect class="fg-box-a" x="34" y="72" width="242" height="44" rx="6"/>
    <text class="fg-v" x="155" y="100" text-anchor="middle">政　府</text>

    <path class="fg-arrow-a" d="M155 232 L155 122"/>
    <path class="fg-arrow-a" d="M150 128 L155 122 L160 128"/>
    <text class="fg-warn" x="165" y="180">拠出金 0.36%</text>
    <text class="fg-s" x="165" y="196">（69条1項）</text>

    <rect class="fg-box-w" x="34" y="232" width="242" height="44" rx="6"/>
    <text class="fg-v" x="155" y="254" text-anchor="middle">一般事業主</text>
    <text class="fg-s" x="155" y="270" text-anchor="middle">納付義務者（69条2項）</text>

    <!-- 右: 支援納付金 -->
    <rect class="fg-box" x="340" y="16" width="290" height="272" rx="8"/>
    <text class="fg-lb" x="485" y="40" text-anchor="middle">子ども・子育て支援納付金</text>
    <text class="fg-s" x="485" y="58" text-anchor="middle">支援法71条の2以下（第三節）</text>

    <rect class="fg-box-a" x="364" y="72" width="242" height="44" rx="6"/>
    <text class="fg-v" x="485" y="100" text-anchor="middle">政　府</text>

    <path class="fg-arrow-a" d="M485 156 L485 122"/>
    <path class="fg-arrow-a" d="M480 128 L485 122 L490 128"/>
    <text class="fg-s" x="495" y="144">支援納付金（71条の3）</text>

    <rect class="fg-box-w" x="364" y="156" width="242" height="40" rx="6"/>
    <text class="fg-v" x="485" y="181" text-anchor="middle">健康保険者等</text>

    <path class="fg-arrow-a" d="M485 232 L485 202"/>
    <path class="fg-arrow-a" d="M480 208 L485 202 L490 208"/>
    <text class="fg-s" x="495" y="224">保険料として</text>

    <rect class="fg-box-w" x="364" y="232" width="242" height="44" rx="6"/>
    <text class="fg-v" x="485" y="254" text-anchor="middle">被保険者・事業主</text>
    <text class="fg-s" x="485" y="270" text-anchor="middle">給与明細に現れるのはここ</text>
  </svg>
  <figcaption>政府が誰から徴収するかが違う。拠出金は一般事業主から直接（69条1項）で、被保険者は登場しない。支援納付金は健康保険者等から徴収し（71条の3第1項）、その保険者が保険料として集める二段構え。給与明細に現れるのは右下だけで、左の拠出金は明細に出ない。</figcaption>
  </figure></article></main></body></html>
