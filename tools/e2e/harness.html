<!doctype html>
<meta charset="utf-8">
<title>keiri-tools E2E harness</title>
<!--
  公開中の3ツールを **実ブラウザで・実ページのまま** 動かす結合テスト。
  ツールのHTMLは1行も改変せず、同一オリジンのiframeに読み込んでユーザーと同じ操作
  (値を入れる→ボタンを押す→描画された結果を読む)をする。

  なぜ要るか: 単体テスト(tests/*.mjs)が見ているのは assets/*_core.js の純ロジックだけで、
  ページ内の <script type="module"> ── 入力の読み取り・fetchしたデータの適用・結果の描画 ──
  は**どのテストも通っていなかった**。Chrome拡張で同じ空白から実バグ(取引先に「販売: 」が
  混入)が出た実績があるので、同じ手当てをツール側にも入れる。
-->
<body style="margin:0;font:14px system-ui">
<iframe id="f" style="width:1100px;height:1000px;border:0"></iframe>
<script type="module">
const q = new URLSearchParams(location.search);
const scene = q.get("scene");

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/** 条件が真になるまで待つ(タイミング勘に頼らない) */
async function waitFor(fn, label, timeout = 8000) {
  const t0 = Date.now();
  for (;;) {
    let v;
    try { v = fn(); } catch { v = null; }
    if (v) return v;
    if (Date.now() - t0 > timeout) throw new Error(`待っても起きなかった: ${label}`);
    await sleep(20);
  }
}

/** ツールのページをiframeで開く。load後は「ユーザーが見ている状態」 */
let openedPage = null; // どのページを実際に開いたか(E2Eの網羅チェックに使う。下の coverage 参照)
function open(path) {
  openedPage = path;
  const f = document.getElementById("f");
  return new Promise((ok, ng) => {
    f.addEventListener("load", () => ok(f.contentDocument), { once: true });
    f.addEventListener("error", () => ng(new Error("iframe load error")), { once: true });
    f.src = path;
  });
}

const set = (doc, id, v) => {
  const el = doc.getElementById(id);
  el.value = v;
  el.dispatchEvent(new doc.defaultView.Event("input", { bubbles: true }));
  el.dispatchEvent(new doc.defaultView.Event("change", { bubbles: true }));
  return el;
};
const click = (doc, id) => doc.getElementById(id).click();
// textContent は display:none でも読めてしまう(結果ボックス非表示の全損10件を素通しした構造要因。
// gbrain ops/webtool-silent-wrong-answer-patterns §46)。「利用者に見えている文字」だけを結果として
// 読むため、本人と祖先の display / visibility を確かめてから読む。隠れていれば throw する
// (waitFor の中では catch されて再試行になり、描画完了まで待つ動きと両立する)
const text = (doc, id) => {
  const el = doc.getElementById(id);
  const win = doc.defaultView;
  for (let n = el; n && n.nodeType === 1; n = n.parentElement) {
    const cs = win.getComputedStyle(n);
    if (cs.display === "none" || cs.visibility === "hidden")
      throw new Error(`#${id} は非表示のまま(${n.tagName.toLowerCase()} が display:${cs.display}/visibility:${cs.visibility})。結果が画面に見えていない`);
  }
  return el.textContent.replace(/\s+/g, " ").trim();
};

// チェックボックスを実ユーザーと同じように操作する(change を発火させる)
const check = (doc, id, on) => {
  const el = doc.getElementById(id);
  if (el.checked !== !!on) el.click();
  return el;
};

const pickRadio = (doc, name, value) => {
  const r = doc.querySelector(`input[name="${name}"][value="${value}"]`);
  r.checked = true;
  r.dispatchEvent(new doc.defaultView.Event("change", { bubbles: true }));
};

// ── 銀行休業日の判定(ハーネス側の独立実装。ツール側のロジックは信用しない) ──────────
// テストが被検体と同じ関数を使うと「両方同じように間違える」ので、ここでは素朴に書き直す。
const isBankHoliday = (iso, holidays) => {
  const [y, m, d] = iso.split("-").map(Number);
  const dow = new Date(y, m - 1, d).getDay();
  if (dow === 0 || dow === 6) return true;          // 土日
  if (m === 12 && d === 31) return true;            // 年末年始
  if (m === 1 && d <= 3) return true;
  return Object.prototype.hasOwnProperty.call(holidays, iso); // 祝日
};

/**
 * 営業日数の独立実装(土日+祝日を休みとする。年末年始オプションはOFF前提)。
 * eigyobi_core は一切使わない — 被検体と同じ関数で数えたら、祝日を落としていても両方同じ答えになる。
 */
const countBusinessIndep = (fromIso, toIso, holidays) => {
  const [fy, fm, fd] = fromIso.split("-").map(Number);
  const [ty, tm, td] = toIso.split("-").map(Number);
  let business = 0, hol = 0, total = 0;
  const end = Date.UTC(ty, tm - 1, td);
  for (let t = Date.UTC(fy, fm - 1, fd); t <= end; t += 86400000) {
    const dt = new Date(t);
    const iso = dt.toISOString().slice(0, 10);
    const w = dt.getUTCDay();
    const isHol = Object.prototype.hasOwnProperty.call(holidays, iso);
    total++;
    if (isHol) hol++;
    if (w !== 0 && w !== 6 && !isHol) business++;
  }
  return { business, holidays: hol, total };
};

/** 支払サイト表を読む → [{payIso, dow, moved}] */
function readPaydayRows(doc) {
  const trs = [...doc.querySelectorAll("#out table tr")].slice(1); // 1行目はヘッダ
  return trs.map((tr) => {
    const tds = tr.querySelectorAll("td");
    const m = tds[1].textContent.match(/(\d{4})\/(\d{2})\/(\d{2})\s*\((.)\)/);
    return {
      payIso: `${m[1]}-${m[2]}-${m[3]}`,
      dow: m[4],
      moved: /営業日調整/.test(tds[2].textContent),
    };
  });
}

  async zengin_ng_copy() {

// 営業日計算: 「祝日を除いて数える」ことがこのツールの存在意義そのもの。
// 祝日データが効いていなければ必ず数がズレる期間を選ぶ = 常設の祝日プローブ。
// GW(5/1〜5/10)は祝日が4日入るので、祝日を落とすと営業日が 3 → 6 に倍増する。
const eigyobiScene = (FROM, TO) => async () => {
  const doc = await open("/docs/eigyobi/");
  const holidays = await (await fetch("/docs/assets/holidays_jp.json?raw=1")).json();
  set(doc, "from", FROM);
  set(doc, "to", TO);
  click(doc, "calc"); // ← 祝日データの到着を待たずに押す(実ユーザーと同じ)
  await waitFor(() => text(doc, "result").includes("営業日"), "営業日の描画");
  const body = text(doc, "result");
  const m = body.match(/営業日\s*([\d,]+)\s*日/);
  return {
    range: `${FROM}〜${TO}`,
    business: m ? Number(m[1].replace(/,/g, "")) : null,
    expected: countBusinessIndep(FROM, TO, holidays), // ハーネス側の独立実装
    warn: body.includes("読み込めませんでした"),
    beyond: body.includes("概算"),
    body,
  };
};
SCENES.eigyobi = eigyobiScene("2026-05-01", "2026-05-10");
SCENES.eigyobi_slow = SCENES.eigyobi;    // 800ms遅らせる(モバイル回線)
SCENES.eigyobi_nodata = SCENES.eigyobi;  // 404(配信失敗)
SCENES.eigyobi_beyond = eigyobiScene("2028-05-01", "2028-05-10"); // 収録範囲外の年

// ── 有給休暇: 月末入社の付与日 ───────────────────────────────────────────────
// 8/31入社の6ヶ月後は「2/31」が無い。JSの日付繰り越しに任せると 3/3 になり、
// **法定より遅い付与日**を答える(年5日の取得義務の起算も遅れる)。
// 正: 応当日が無い月はその月の末日 = 2/28 (民法143条2項)。閏年なら2/29。
// yukyu_core は使わない — 被検体と同じ関数で期待値を作ったら、両方同じように間違える。
const lastDayIndep = (y, m) => {
  const leap = (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
  return [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1];
};
const jp = (iso) => iso.replaceAll("-", "/");
const yukyuScene = (HIRE, WDAYS, WHOURS) => async () => {
  const doc = await open("/docs/yukyu/");
  set(doc, "hire", HIRE);
  set(doc, "wdays", String(WDAYS));
  set(doc, "whours", String(WHOURS));
  click(doc, "calc");
  await waitFor(() => text(doc, "result").includes("付与"), "付与結果の描画");
  const body = text(doc, "result");

  const [hy, hm, hd] = HIRE.split("-").map(Number);
  const tm = ((hm - 1 + 6) % 12) + 1;
  const ty = hy + Math.floor((hm - 1 + 6) / 12);

  // 正: 応当日が無ければその月の末日（民法143条2項）
  const legal = `${ty}-${String(tm).padStart(2, "0")}-${String(Math.min(hd, lastDayIndep(ty, tm))).padStart(2, "0")}`;
  // 誤: JSの日付繰り越しに任せたときに出る日（2/31 → 3/3）。これが画面に出たら即アウト
  const carried = (() => {
    const t = new Date(hy, hm - 1 + 6, hd);
    return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`;
  })();

  return {
    hire: HIRE, legal, carried,
    showsLegal: body.includes(jp(legal)),                       // 法定の付与日を出しているか
    showsCarried: carried !== legal && body.includes(jp(carried)), // 繰り越した日を出していないか
    clampNote: body.includes("末日"),                           // 末日に丸めたことを申告しているか
    body,
  };
};
// 8/31入社 = 6ヶ月後が2月(28/29日)。繰り越しバグが最大3日ズレる常設プローブ。
// 入社日は過去に固定 = 実行日に依存しないテストになる（第3便の教訓）
SCENES.yukyu_monthend = yukyuScene("2020-08-31", 5, 40);       // → 2021-02-28（誤: 03-03）

// ── 消費税・端数処理 ────────────────────────────────────────────────
// 期待値は shohizei_core を使わず BigInt の厳密整数で作る(被検体と同じ式で照合しない)。
const taxIndep = (amount, num, den) => Number((BigInt(amount) * BigInt(num)) / BigInt(den)); // 切捨て

/** 明細の行を rows の内容ちょうどにして計算させる */
const fillLines = (doc, rows) => {
  const addBtn = doc.getElementById("add-line");
  let have = doc.querySelectorAll(".inv-line").length;
  while (have < rows.length) { addBtn.click(); have++; }
  const lines = [...doc.querySelectorAll(".inv-line")];
  // 余った行は削除
  for (let i = rows.length; i < lines.length; i++) lines[i].querySelector(".l-del").click();
  const live = [...doc.querySelectorAll(".inv-line")];
  rows.forEach((r, i) => {
    const row = live[i];
    row.querySelector(".l-name").value = r.name || "";
    const amt = row.querySelector(".l-amount");
    amt.value = String(r.amount);
    amt.dispatchEvent(new doc.defaultView.Event("input", { bubbles: true }));
    row.querySelector(".l-rate").value = r.rate;
  });
};

// 国税庁 インボイスQ&A 問57 の記載例そのもの。税込100,000円 / 10%と8%の混在。
// 10%対象 60,000 → 5,454円 / 8%対象 40,000 → 2,962円 / 合計 8,416円
SCENES.shohizei_invoice = async () => {
  const doc = await open("/docs/shohizei/");
  pickRadio(doc, "inv-dir", "included");
  fillLines(doc, [
    { name: "小麦粉", amount: 5000, rate: "reduced" },
    { name: "牛肉", amount: 8000, rate: "reduced" },
    { name: "その他(8%)", amount: 27000, rate: "reduced" },
    { name: "キッチンペーパー", amount: 2000, rate: "standard" },
    { name: "その他(10%)", amount: 58000, rate: "standard" },
  ]);
  doc.getElementById("inv-mode").value = "floor";
  click(doc, "inv-calc");
  await waitFor(() => text(doc, "inv-result").includes("消費税額"), "請求書の計算結果");
  const body = text(doc, "inv-result");

  // ハーネス側の独立計算(税率ごとに合計してから1回だけ切捨て)
  const std = taxIndep(60000, 10, 110);   // 5454

};

// 税込→税額。99円は「真の答えがちょうど9円」= 素朴な浮動小数点実装(税込/1.1*0.1)が
// 8円を返す値。ページ側が ×10/110 以外の書き方に変わったら、ここで落ちる常設プローブ。
const convertScene = (AMOUNT, DIR, RATE) => async () => {
  const doc = await open("/docs/shohizei/");
  pickRadio(doc, "dir", DIR);
  pickRadio(doc, "rate", RATE);
  set(doc, "amount", String(AMOUNT));
  doc.getElementById("mode").value = "floor";
  click(doc, "calc");
  await waitFor(() => text(doc, "result").includes("消費税額"), "税込税抜の計算結果");

  const num = (id) => Number(text(doc, id).replace(/[^0-9]/g, ""));
  const [n, d] = RATE === "standard"
    ? (DIR === "included" ? [10, 110] : [10, 100])
    : (DIR === "included" ? [8, 108] : [8, 100]);
  const expectedTax = taxIndep(AMOUNT, n, d);
  const tax = num("r-tax"), excluded = num("r-excluded"), included = num("r-included");
  return {
    amount: AMOUNT, dir: DIR, rate: RATE,
    tax, excluded, included, expectedTax,
    taxOk: tax === expectedTax,
    // 画面の3つの数字が足し算で閉じていること(閉じないと利用者が必ず気付く)
    reconciles: excluded + tax === included,
    anchorOk: DIR === "included" ? included === AMOUNT : excluded === AMOUNT,
  };
};

// ── 申告(割戻し/積上げ) ──────────────────────────────────────────────
// 納付税額の期待値はハーネス側で独立に組む(shohizei_core を使わない)。
const declIndep = (salesTax, purchaseTax) => {
  const floorUnit = (v, u) => (v / BigInt(u)) * BigInt(u);
  const raw = BigInt(salesTax) - BigInt(purchaseTax);
  const national = raw >= 0n ? floorUnit(raw, 100) : raw;
  const local = floorUnit((national * 22n) / 78n, 100);
  return { national: Number(national), local: Number(local), total: Number(national + local) };
};

// 売上 税込11,000,000(10%) → 課税標準額10,000,000 → 売上税額 780,000
// 仕入 受領インボイスの消費税額等 500,000 → 積上げ → 390,000
// 差引 390,000 / 地方 110,000 / 納付 500,000
SCENES.shohizei_shinkoku = async () => {
  const doc = await open("/docs/shohizei/");
  set(doc, "s10", "11000000");
  set(doc, "s-inv", "1000000");   // 積上げも比較できるように入れる
  set(doc, "p10", "5500000");
  set(doc, "p-inv", "500000");
  click(doc, "dec-calc");
  await waitFor(() => text(doc, "dec-result").includes("納付税額"), "申告の計算結果");

  const body = text(doc, "dec-result");
  const num = (id) => Number(text(doc, id).replace(/[^0-9-]/g, ""));

  // 独立オラクル: 売上は割戻し(税込×100/110→千円未満切捨て→×7.8%)、仕入は積上げ(×78/100)
  const base = Number((11000000n * 100n) / 110n / 1000n * 1000n); // 10,000,000
  const salesTax = Number((BigInt(base) * 78n) / 1000n);          // 780,000
  const purchaseTax = Number((500000n * 78n) / 100n);             // 390,000
  const want = declIndep(salesTax, purchaseTax);

  // 「選択肢として提示している組み合わせ」は比較表の行だけ。
  // 結果ブロック全体を正規表現で見ると、末尾の注意書き
  // (「売上=積上げ × 仕入=割戻し は認められない」)を"提示している"と誤検知する。
  const comboLabels = [...doc.querySelectorAll("#dec-result table tr")]
    .map((tr) => (tr.querySelector("td")?.textContent || "").replace(/\s+/g, " ").trim())
    .filter((t) => t.includes("売上="));

  return {
    body,
    want,
    comboLabels,
    national: num("dec-national"),
    local: num("dec-local"),
    total: num("dec-total"),
    // 認められない組み合わせを選択肢として出していないこと(出したら規定違反を勧めることになる)
    offersForbidden: comboLabels.some((l) => /売上=積上げ × 仕入=割戻し/.test(l)),
    showsThree: comboLabels.length === 3,
    // 注意書きとしては、なぜ出さないのかを説明していること
    explainsForbidden: /認められない/.test(body) && /6391/.test(body),
  };
};

// 積上げ計算に必要な「請求書の消費税額等の合計」が空のとき、0として計算して
// 積上げを不当に有利に見せないこと(黙って間違える系のパターン)。

  return {

    // 比較に残るのは「売上=割戻し × 仕入=割戻し」だけ
    onlyDivide: !/積上げ計算です|× 仕入=積上げ/.test(body.replace(/\s+/g, " ")),
    positive: num("dec-total") > 0,

// ── 給与の源泉徴収(月額表) ──────────────────────────────────────────────────
// このツールの存在意義は「国税庁PDFの税額表を引く代わりをする」こと。表が効いていなければ
// 必ず額がズレる。**期待値はハーネス側で生の月額表JSONを独立に引いて出す**
// (被検体と同じ gensen_kyuyo_core.js を使うと、coreのバグで両方同じように間違える)。
const lookupIndep = (table, A, n, ran) => {
  if (ran === "otsu") {
    if (A < table.otsuLowMax) return Math.floor(A * table.otsuLowRate);
    const row = table.rows.find((r) => A >= r.min && A < r.max);
    return row ? row.otsu : null;
  }
  if (A < table.otsuLowMax) return 0;
  const row = table.rows.find((r) => A >= r.min && A < r.max);
  return row ? row.kou[Math.min(n, 7)] : null;
};

// ═══════════════════════════════════════════════════════════════════════════
// 報酬・料金の源泉徴収（/gensen-choshu/ の上半分）— 所法204条・所基通204-2
//
// ★このページで**E2Eが1つも無かった**部分（2026-07-26に気づいて新設）。給与・賞与だけを
//   見ていたので、**消費税の区分で源泉徴収の対象額が変わる**という、このページで実務上
//   いちばん間違えるロジック（所基通204-2）が誰にも触られていなかった。
// ★期待値は実装を通さず、率と条文から手で積む（外部オラクル）:
//     報酬100,000円・区分あり → 対象100,000 × 10.21% = **10,210円**
//     同・区分なし           → 対象は税込110,000 → 110,000 × 10.21% = **11,231円**
//   ★この差額1,021円が、消費税率を掛けている箇所（RATE_SHOHIZEI）が生きている証拠。
//     率を0にすれば「区分なし」が10,210円に落ちてこのシーンが赤くなる。
// ═══════════════════════════════════════════════════════════════════════════
const houshuScene = (inp) => async () => {
  const doc = await open("/docs/gensen-choshu/");
  // ★このページはタブ（給与／賞与／報酬）で、報酬ペインは**初期状態では非表示**。
  //   タブを押さずに操作すると、text() が「#result は非表示のまま」で throw し続ける
  //   （＝結果が画面に見えていない状態を、そもそも結果として読まない作り）。
  click(doc, "tab-hoshu");
  set(doc, "kind", inp.kind ?? "general");
  set(doc, "fee", String(inp.fee ?? 100000));
  // ラジオ（name="tax"）は id が無いので value で名指しして押す
  doc.querySelector(`input[name="tax"][value="${inp.tax ?? "sep"}"]`).click();
  click(doc, "calc");

  await waitFor(() => /源泉徴収税額|入力してください/.test(text(doc, "result")), "報酬の計算結果");
  const body = text(doc, "result");
  const num = (re) => { const m = body.match(re); return m ? Number(m[1].replace(/,/g, "")) : null; };
  return {
    ...inp,
    tax: num(/源泉徴収税額\s*¥([\d,]+)/),
    target: num(/源泉徴収の対象額\s*¥([\d,]+)/),
    total: num(/請求額（合計）\s*¥([\d,]+)/),
    // ★消費税の行の**表示ラベル**。率と表示を別々に持つと片方だけ古くなるので、
    //   画面が名乗る率（"10%"）まで見る（RATE_SHOHIZEI_LABEL から描かれているか）。
    shohizeiLabel: (body.match(/消費税（([\d.]+%)）/) || [])[1] ?? null,
    shohizei: num(/消費税（[\d.]+%）\s*¥([\d,]+)/),
    body,
  };
};
// 区分あり（既定）: 税抜100,000が対象 → 10,210円
SCENES.gensen_houshu = houshuScene({});
// ★区分なし: 税込110,000が対象 → 11,231円。**消費税率が計算に効いている唯一の経路**

// ── 賞与の源泉徴収(算出率の表) ───────────────────────────────────────────────
// 賞与は月額表ではなく「算出率の表」で**率**を引く。率を決めるのは**前月の給与**。
// ここでも期待値はハーネス側で生JSONを独立に引いて出す(被検体のcoreを使わない)。
const rateIndep = (t, zengetsu, n, ran) => {
  const inBand = (b, y) =>
    y >= (b.min == null ? 0 : b.min * 1000) && (b.max == null || y < b.max * 1000);
  if (ran === "otsu") {
    const row = t.rows.find((r) => r.otsu && inBand(r.otsu, zengetsu));
    return row ? row.rate : null;
  }
  const row = t.rows.find((r) => inBand(r.kou[Math.min(n, 7)], zengetsu));
  return row ? row.rate : null;
};

const shoyoScene = (p) => async () => {
  const doc = await open("/docs/gensen-choshu/");
  const [st, mt] = await Promise.all([
    (await fetch("/docs/assets/gensen_shoyo_r08.json?raw=1")).json(),
    (await fetch("/docs/assets/gensen_getsugaku_r08.json?raw=1")).json(),
  ]);

  doc.getElementById("tab-shoyo").click();
  if (p.ran === "otsu") doc.querySelector('input[name="ranS"][value="otsu"]').click();
  set(doc, "shoyoAmt", String(p.shoyo));
  set(doc, "shoyoIns", String(p.shoyoIns || 0));
  set(doc, "zenAmt", String(p.zengetsu || 0));
  set(doc, "zenIns", String(p.zengetsuIns || 0));
  if (p.ran !== "otsu") set(doc, "fuyoS", String(p.n || 0));
  click(doc, "calcS"); // ← 表の到着を待たずに押す(実ユーザーと同じ)

  await waitFor(
    () => /源泉徴収税額|読み込めませんでした|入力を確認/.test(text(doc, "resultS")),
    "賞与の計算結果",
  );
  const body = text(doc, "resultS");
  const m = body.match(/源泉徴収税額（[^）]*）\s*¥([\d,]+)/);

  // ハーネス側の独立計算
  const shoyoAfter = Math.max(0, p.shoyo - (p.shoyoIns || 0));
  const zenAfter = Math.max(0, (p.zengetsu || 0) - (p.zengetsuIns || 0));
  let expected, viaGetsugaku = false;
  if (shoyoAfter > zenAfter * 10) {
    // 10倍超 → 月額表による例外計算(÷6 → +前月 → 月額表 → −前月の税額 → ×6)
    viaGetsugaku = true;
    const per = Math.floor(shoyoAfter / 6);
    const t1 = lookupIndep(mt, per + zenAfter, p.n || 0, p.ran || "kou");
    const t2 = zenAfter > 0 ? lookupIndep(mt, zenAfter, p.n || 0, p.ran || "kou") : 0;
    expected = Math.max(0, t1 - t2) * 6;
  } else {
    const rate = rateIndep(st, zenAfter, p.n || 0, p.ran || "kou");
    expected = Math.floor((shoyoAfter * rate) / 100000);
  }

  return {
    ...p,
    tax: m ? Number(m[1].replace(/,/g, "")) : null,
    expected,
    viaGetsugaku,
    // 例外計算に入ったことを画面が申告しているか(黙って別の計算をしない)
    declaresGetsugaku: /算出率の表を使えません/.test(body),
    showsYear: body.includes(st.year),
    failed: body.includes("読み込めませんでした"),
    body,
  };
};

const KOYOU_WORKER_PERMILLE = { general: 5, agri_sake: 6, construction: 6 };

const shahoScene = ({ monthly, age, bonus = 0, standard = null, gyoshu = null }) => async () => {
  const doc = await open("/docs/shakai-hoken/");

    () => /本人負担|読み込めませんでした/.test(text(doc, "result")),
    "社会保険料の計算結果",
  );
  const body = text(doc, "result");

  // 公式額表(東京)から健保・支援金・厚年の本人負担を組む。
  // standard を明示できる(報酬月額 305,000 は等級としては 300,000 になる、のような入力を試すため)

  const g = kenpo.grades.find((x) => x.standard === std);
  const kaigo = age >= 40 && age < 65;
  // ★厚生年金は標準報酬月額650,000円(第32級)で頭打ち。**公式額表でも第36級以上は厚年の欄が無い**
  //   (fixtureで kosei_grade:null / kosei_half キー自体が無い)。素直に g.kosei_half を読むと
  //   undefined→NaN になるので、厚年だけは「厚年の欄を持つ最後の等級」から取る。
  //   これも公式PDF由来＝ツールの KOSEI_MAX を一切通さない独立オラクル。
  const koseiRow = g && g.kosei_half != null
    ? g
    : kenpo.grades.filter((x) => x.kosei_half != null).pop();
  // ★公式額表の折半額は**50銭を含む**(例 第37級の健保 34,967.5円)。合計してから丸めると
  //   項目ごとに丸める実際の控除と1円ずれる。端数処理は「50銭以下切捨・50銭超切上」
  //   (納入告知書の通例)を**項目ごとに**適用する。この規則自体はツールの外側の事実なので、
  //   ここで独立に書き下す(shaho_core.js を import しない)。
  const half = (v) => ((v - Math.floor(v)) > 0.5 ? Math.ceil(v) : Math.floor(v));
  const shahoSelf = g
    ? half(kaigo ? g.kenko_kaigo_half : g.kenko_half) + half(g.kosodate_half) + half(koseiRow.kosei_half)
    : null;

  // ★雇用保険は**標準報酬月額ではなく賃金総額(monthly)**にかかる(徴収法11条1項)。
  //   ここで std でなく monthly を使うのが肝。ページが標準報酬月額を渡していれば、
  //   monthly≠std のシーン(shaho_koyou_gaku)でここと食い違って落ちる。
  //   端数は50銭以下切捨・50銭超切上
  const raw = monthly * (KOYOU_WORKER_PERMILLE[gyoshu ?? "general"] / 1000);
  const koyouSelf = (raw - Math.floor(raw)) > 0.5 ? Math.ceil(raw) : Math.floor(raw);
  const expectedSelf = shahoSelf === null ? null : shahoSelf + koyouSelf;

  const m = body.match(/毎月の本人負担\s*¥([\d,]+)/);
  // 「介護保険料の行が出ているか」は**本文への正規表現で見てはいけない**。画面は
  // 「30歳のため介護保険料はかかりません」という**否定文**にも同じ語を含むので、
  // テキスト検索では「提示」と「否定」を区別できない(第10便で同じ誤検知をした)。
  // → 結果テーブルの**行ラベル**(DOMの構造)で見る
  const rowLabels = [...doc.querySelectorAll("#result table tr")]
    .map((tr) => (tr.cells[0]?.textContent || "").trim());
  return {
    monthly, age,
    self: m ? Number(m[1].replace(/,/g, "")) : null,
    expected: expectedSelf,          // ← 公式PDF+厚労省公表値由来。ツールのコードを一切通っていない
    expectedKoyou: koyouSelf,
    kaigoApplies: kaigo,
    showsKaigoRow: rowLabels.some((l) => l.includes("介護保険")),
    showsKoyouRow: rowLabels.some((l) => l.includes("雇用保険")),
    showsYear: /令和\d+年度の料率/.test(body), // どの年度の料率で答えたかを申告しているか
    // 厚年の上限に張り付いた人に、上限であることと今後の段階的引上げを申告しているか。
    // 注記の額はデータ(kosei_grade_cap)から描く＝ページに手書きしていないことも併せて見る
    capNote: (() => {
      const el = doc.querySelector("#kosei-cap-note");
      if (!el) return null;
      const t = el.textContent.replace(/\s+/g, "");
      return {
        showsCap: t.includes("¥650,000"),
        showsSchedule: /2027年9月に第33級¥680,000/.test(t) &&
          /2028年9月に第34級¥710,000/.test(t) && /2029年9月に第35級¥750,000/.test(t),
        saysCurrent: t.includes("この計算は現行の上限で出しています"),
      };
    })(),
    rowLabels,
    failed: body.includes("読み込めませんでした"),
    body,
  };
};

  };
};

const tedoriScene = ({ gross, age = 30, pref = "東京都", dependents = 0,

    () => /毎月の手取り|読み込めませんでした|入力してください/.test(text(doc, "result")),

  const body = text(doc, "result");

  // ── ハーネス側の独立オラクル ──
  const g = kenpo.grades.find((x) => x.standard === gross);

    : null;

  const koyou = (rawK - Math.floor(rawK)) > 0.5 ? Math.ceil(rawK) : Math.floor(rawK);
  const shahoSelf = shahoBase === null ? null : shahoBase + koyou;
  const A = shahoSelf === null ? null : gross - shahoSelf;          // 社保控除後

};

  const roundH = (v) => (v - Math.floor(v)) > 0.5 ? Math.ceil(v) : Math.floor(v);
  const kaigo = age >= 40 && age < 65;
  const stdBonus = Math.floor(bonus / 1000) * 1000;

      expectedTax = Math.floor((shoyoAfter * rate) / 100000);

//   期待値の手計算は同テストの S1〜S10（条文書き下しオラクルと全域照合つき）。
const torokuScene = ({ rows, applyDate = "2026-07-01", knownDate = "" }) => async () => {
  const doc = await open("/docs/sozoku-toki-menkyozei/");
  // 既定で2行ある。足りなければ追加、余れば削除する。
  const nrows = () => doc.querySelectorAll(".prow").length;
  // ★入力行と申請日の既定値はページ内スクリプトが作る＝file://のスクショでは見えない。
  //   「利用者が最初に見る画面が空でないこと」はここでしか守れないので機械で確かめる。
  const defaultRows = nrows();
  const defaultApplyDate = doc.getElementById("applyDate").value;
  const defaultVals = [...doc.querySelectorAll(".p-val")].map((e) => e.value);
  while (nrows() < rows.length) doc.getElementById("addrow").click();
  while (nrows() > rows.length) doc.querySelectorAll(".prow")[nrows() - 1].querySelector(".p-del").click();
  [...doc.querySelectorAll(".prow")].forEach((row, i) => {
    const r = rows[i];
    const put = (sel, v) => {
      const el = row.querySelector(sel);
      el.value = String(v);
      el.dispatchEvent(new Event("input", { bubbles: true }));
      el.dispatchEvent(new Event("change", { bubbles: true }));
    };
    put(".p-kind", r.kind);
    put(".p-val", r.value);
    put(".p-num", r.num ?? 1);
    put(".p-den", r.den ?? 1);
  });
  set(doc, "applyDate", applyDate);
  set(doc, "knownDate", knownDate);
  click(doc, "calc"); // ← 参照データの到着を待たずに押す（実ユーザーと同じ）

  await waitFor(
    () => /¥|読み込めませんでした|計算できませんでした|評価額を入力してください/.test(text(doc, "result")),
    "登録免許税の計算結果",
  );
  const body = text(doc, "result");
  const num = (re) => { const m = body.match(re); return m ? Number(m[1].replace(/,/g, "")) : null; };
  return {
    defaultRows,
    defaultApplyDate,
    defaultValsFilled: defaultVals.length > 0 && defaultVals.every((v) => Number(v) > 0),
    tax: num(/¥([\d,]+)/),
    base: num(/課税標準 ([\d,]+)円/),
    exemptCount: num(/うち([\d,]+)件は免税/),
    allExempt: body.includes("登録免許税は課されません"),
    minApplied: body.includes("1,000円未満のため税額は1,000円"),
    deadline: (body.match(/(\d{4}-\d{2}-\d{2}) まで/) || [])[1] || null,
    usedShikoBi: body.includes("施行日"),
    expired: body.includes("免税判定を行いません"),
    showsYear: /令和\d+年/.test(body),
    failed: body.includes("読み込めませんでした"),
    body,
  };
};

// ── 遺留分 (/iryubun/) ──────────────────────────────────────────────────────
// ★単体（tests/test_iryubun.mjs）は core しか見ないので、「家族構成の読み取り→総体的遺留分→
//   法定相続分→個別的遺留分→侵害額の3項目→描画」の配線はここでしか守れない。
//   期待値の手計算は同テストの §3・§6（条文書き下しオラクルと全域照合つき）。
const iryubunScene = (o) => async () => {
  const doc = await open("/docs/iryubun/");
  // 既定値もページの一部（利用者が最初に見る画面）。空でないことを機械で確かめる。
  const defaultIsan = doc.getElementById("isanTotal").value;
  const defaultKaishi = doc.getElementById("kaishiDate").value;
  set(doc, "kaishiDate", o.kaishiDate ?? "2026-04-01");
  set(doc, "shittaDate", o.shittaDate ?? "");
  set(doc, "isanTotal", o.isan ?? 100000000);
  set(doc, "saimuTotal", o.saimu ?? 0);
  set(doc, "zoyoSozokunin", o.zoyoSozokunin ?? 0);
  set(doc, "zoyoDaisansha", o.zoyoDaisansha ?? 0);
  set(doc, "zoyoSongaiShiri", o.zoyoSongai ?? 0);
  set(doc, "hasSpouse", o.spouse ?? "yes");
  set(doc, "numChildrenReal", o.real ?? 2);
  set(doc, "numChildrenAdopted", o.adopted ?? 0);
  set(doc, "numChildrenRenounced", o.renounced ?? 0);
  set(doc, "numParents", o.parents ?? 0);
  set(doc, "numSiblings", o.siblings ?? 0);
  set(doc, "me", o.me ?? "child");
  set(doc, "meJuizo", o.meJuizo ?? 0);
  set(doc, "meShutoku", o.meShutoku ?? 0);
  set(doc, "meSaimu", o.meSaimu ?? 0);
  click(doc, "calc"); // ← 参照データの到着を待たずに押す（実ユーザーと同じ）

  await waitFor(
    () => /¥|読み込めませんでした|計算できませんでした|より前に開始した相続/.test(text(doc, "result")),
    "遺留分の計算結果",
  );
  const body = text(doc, "result");
  const num = (re) => { const m = body.match(re); return m ? Number(m[1].replace(/,/g, "")) : null; };
  // 表の「1人あたりの遺留分」列を相続人ごとに読む（描画の配線を名指しで確かめる）
  const rows = [...(doc.querySelectorAll("#kobetsu-table tbody tr") || [])].map((tr) => {
    const td = [...tr.querySelectorAll("td")].map((e) => e.textContent.trim());
    return { label: td[0], count: td[1], houtei: td[2], iryubun: td[3], yen: td[4] };
  });
  return {
    defaultIsan: Number(defaultIsan) || 0,
    defaultKaishi,
    santei: num(/遺留分を算定するための財産 ¥([\d,]+)/),
    shingai: num(/あなたが請求できる遺留分侵害額 ¥([\d,]+)/),
    sotai: (body.match(/総体的遺留分（相続人全体の割合）: (\S+?) /) || [])[1] || null,
    rows,
    // 兄弟姉妹の行は「法定相続分はあるが遺留分はなし」になっていること
    kyodaiRow: rows.find((r) => r.label.includes("兄弟姉妹")) || null,
    daremoNashi: body.includes("遺留分を持つ相続人が一人もいません"),
    meNashi: body.includes("あなたには遺留分がありません"),
    kyuho: /より前に開始した相続のため/.test(body),
    kyuhoJojo: body.includes("1028条"),
    kigen: (body.match(/知った日から1年 → (\d{4}-\d{2}-\d{2})/) || [])[1] || null,
    kigen10: (body.match(/相続開始から10年 → (\d{4}-\d{2}-\d{2})/) || [])[1] || null,
    saimuChoka: body.includes("債務が財産を上回っています"),
    failed: body.includes("読み込めませんでした"),
    body,
  };
};

// ── 不動産売却の税金 (/fudosan-jouto/) ───────────────────────────────────
// ★単体（tests/test_jouto.mjs）は core しか見ないので、「日付の読み取り→1月1日での所有期間判定→
//   建物の減価償却→概算取得費との比較→特別控除→税率の選択→端数処理→表の描画」の配線は
//   ここでしか守れない。期待値は同テストの §1〜§9（国税庁 No.3208 の公表値オラクルつき）。
// ★建物の構造の選択肢と償却率の表はページ内スクリプトが参照データから描くので、
//   file:// のスクショでは空に見える。「選択肢が実際に生えているか」も機械で確かめる。
const joutoScene = (o) => async () => {
  const doc = await open("/docs/fudosan-jouto/");
  // 既定値もページの一部（利用者が最初に見る画面）。空でないことを確かめる。
  const defaultJoutoKagaku = doc.getElementById("joutoKagaku").value;
  const defaultShutokuBi = doc.getElementById("shutokuBi").value;
  set(doc, "shutokuBi", o.shutokuBi ?? "2021-05-01");
  set(doc, "joutoBi", o.joutoBi ?? "2026-07-15");
  set(doc, "joutoKagaku", String(o.joutoKagaku ?? 50000000));
  set(doc, "joutoHiyo", String(o.joutoHiyo ?? 1700000));
  set(doc, "shutokuMode", o.shutokuMode ?? "jitsugaku");
  set(doc, "tochiShutokuhi", String(o.tochiShutokuhi ?? 20000000));
  set(doc, "tatemonoShutokuKagaku", String(o.tatemonoShutokuKagaku ?? 15000000));
  set(doc, "tokureiKey", o.tokureiKey ?? "none");
  if (o.jigyoYo != null) set(doc, "jigyoYo", o.jigyoYo);
  if (o.keigenZeiritsu != null) set(doc, "keigenZeiritsu", o.keigenZeiritsu);
  if (o.sozokuninSu != null) set(doc, "sozokuninSu", String(o.sozokuninSu));
  // 構造の選択肢は参照データから描かれる。届く前に選ぼうとしても落ちないよう、押す直前に読む。
  const kozoOptions = doc.querySelectorAll("#kozoKey option").length;
  if (o.kozoKey) set(doc, "kozoKey", o.kozoKey);
  click(doc, "calc"); // ← 参照データの到着を待たずに押す（実ユーザーと同じ）

  await waitFor(
    () => /税金の合計は|読み込めませんでした|計算できませんでした/.test(text(doc, "result")),
    "譲渡所得の計算結果",
  );
  const body = text(doc, "result");
  const yen = (s) => (s == null ? null : Number(String(s).replace(/[^\d-]/g, "")) || 0);
  // ★頭打ちや注記で1つのセルに複数の金額が出ることがあるので、行を名指しして
  //   その行の最初の ¥ だけを読む（数字を全部連結して別物を作らない）。
  const rowYen = (id) => {
    const el = doc.getElementById(id);
    if (!el) return null;
    const m = el.textContent.match(/¥[\d,]+/);
    return m ? yen(m[0]) : null;
  };
  const zeigakuEl = doc.getElementById("zeigaku");
  return {
    defaultJoutoKagaku: Number(defaultJoutoKagaku) || 0,
    defaultShutokuBi,
    kozoOptions,
    goukei: zeigakuEl ? yen((zeigakuEl.textContent.match(/¥[\d,]+/) || [])[0]) : null,
    kazei: rowYen("kazei-row"),
    shotokuZei: rowYen("shotokuzei-row"),
    juminZei: rowYen("juminzei-row"),
    kojo: rowYen("kojo-row"),
    // 区分（短期/長期/軽減）は税率の選択そのもの。文言で読む
    tanki: /短期譲渡所得/.test(body),
    choki: /長期譲渡所得/.test(body),
    keigen: /軽減税率/.test(body),
    kikanHyoji: (doc.getElementById("kikan-hyoji") || {}).textContent || "",
    kurikoshi: doc.getElementById("kurikoshi") ? true : false,
    gaisan: /概算取得費/.test(body),
    shokyakuNote: (doc.getElementById("shokyaku-note") || {}).textContent || "",
    akiyaBlocked: (doc.getElementById("akiya-block-note") || {}).textContent || "",
    showsYear: /令和\d+年/.test(body),
    failed: body.includes("読み込めませんでした"),
    body,
  };
};

// ★単体（tests/test_hikazei_setai.mjs）は core しか見ないので、「世帯人数の読み取り→各人の
//   収入と年齢→公的年金等控除→扶養の付け方の探索→世帯の判定→表の描画」の配線はここでしか守れない。
//   期待値の手計算は同テストの §3・§5・§6・§7（国税庁の速算表オラクルと全域照合つき）。
// ★参照データを2つ（hikazei_setai_r08.json と juminzei_r08.json）待つので、
//   片方だけ落としたときに黙って答えを出さないことも見る。
const hikazeiScene = (o) => async () => {
  const doc = await open("/docs/hikazei-setai/");
  // 既定値もページの一部（利用者が最初に見る画面）。空でないことを機械で確かめる。
  const defaultNenkin = doc.getElementById("m1_nenkin").value;
  const defaultAge = doc.getElementById("m1_age").value;
  set(doc, "kyuchi", String(o.kyuchi ?? 1));
  set(doc, "zeisei", o.zeisei ?? "r7");
  set(doc, "ninzu", String(o.ninzu ?? 2));
  for (let i = 1; i <= 6; i++) {
    const m = (o.members || [])[i - 1] || {};
    if (m.zokugara) set(doc, `m${i}_zokugara`, m.zokugara);
    if (m.age != null) set(doc, `m${i}_age`, m.age);
    if (m.nenkin != null) set(doc, `m${i}_nenkin`, m.nenkin);
    if (m.kyuyo != null) set(doc, `m${i}_kyuyo`, m.kyuyo);
    if (m.sonota != null) set(doc, `m${i}_sonota`, m.sonota);
    if (m.tokurei != null) set(doc, `m${i}_tokurei`, m.tokurei);
  }
  click(doc, "calc"); // ← 参照データの到着を待たずに押す（実ユーザーと同じ）

  await waitFor(
    () => /非課税世帯です|非課税世帯ではありません|読み込めませんでした|判定できませんでした/
      .test(text(doc, "result")),
    "住民税非課税世帯の判定結果",
  );
  const body = text(doc, "result");
  const yen = (s) => (s == null ? null : Number(String(s).replace(/[^\d-]/g, "")) || 0);
  // 世帯員ごとの行を名指しで読む（描画の配線を確かめる。合計だけ見ると1人分の取り違えを見逃す）
  const rows = [...(doc.querySelectorAll("#setai-table tbody tr") || [])].map((tr) => {
    const td = [...tr.querySelectorAll("td")].map((e) => e.textContent.trim());
    return { label: td[0], shotoku: yen(td[1]), limit: td[2] === "—" ? null : yen(td[2]),
             hantei: td[3], choka: td[4] === "—" ? null : yen(td[4]) };
  });
  // 「見えている表示だけ非課税」を検出するため、判定の文言そのものも別に取る。
  // ★データが届かなかったときは #verdict を描かない（＝断り書きだけ）。null を素通しすると
  //   例外になって「fail closed を確かめるシーン」自体が動かないので、無い場合は空文字にする。
  const verdictEl = doc.getElementById("verdict");
  const verdict = verdictEl ? verdictEl.textContent : "";
  return {
    defaultNenkin: Number(defaultNenkin) || 0,
    defaultAge: Number(defaultAge) || 0,
    // 既定で見えている入力行の数（世帯人数の連動が死ぬと全行見えたまま／全行消えたままになる）
    visibleRows: [1, 2, 3, 4, 5, 6].filter((i) =>
      doc.getElementById(`m${i}`).style.display !== "none").length,
    hikazei: /非課税世帯です/.test(verdict),
    kazei: /非課税世帯ではありません/.test(verdict),
    rows,
    tsukekae: body.includes("扶養の付け方を変えることで非課税世帯になります"),
    j295: body.includes("障害者・未成年者・寡婦・ひとり親で合計所得135万円以下"),
    border65: yen((body.match(/65歳以上は(¥[\d,]+)まで/) || [])[1]),
    borderU65: yen((body.match(/65歳未満は(¥[\d,]+)まで/) || [])[1]),
    failed: body.includes("読み込めませんでした"),
    body,
  };
};

// ── インボイス登録番号チェック (/invoice-bangou/) ────────────────────────────
// ★単体（tests/test_invoice_bangou.mjs）は core しか見ない。ページ側の
//   「貼り付けたテキストの読み取り → 一括判定 → 表の描画」はどのテストも通っていない。
//   参照データを持たないツールなので fetch 待ちは無いが、**貼った行数ぶん描けているか**が要。
//   1件だけ描いて残りを黙って捨てる事故（このツールの本命が一括処理なので致命）を捕まえる。
const invoiceBangouScene = (raw) => async () => {
  const d = await open("/docs/invoice-bangou/");
  set(d, "input", raw);
  click(d, "run");
  await waitFor(
    () => /件を確認しました|番号が入力されていません/.test(text(d, "result")),
    "登録番号の判定結果",
  );
  const body = text(d, "result");
  const num = (re) => { const m = body.match(re); return m ? Number(m[1]) : null; };
  const rows = [...d.querySelectorAll("#result-table tbody tr")].map((tr) => {
    const td = [...tr.querySelectorAll("td")].map((x) => x.textContent.trim());
    return { line: Number(td[0]), formatted: td[2], hantei: td[3] };
  });
  return {
    total: num(/(\d+)件を確認しました/),
    houjin: num(/桁が合う (\d+)件/),
    notHoujin: num(/法人番号ではない (\d+)件/),
    format: num(/形式の誤り (\d+)件/),
    rows,
    // ★「桁が合う＝実在」と誤解させない注意書きが出ていること（要素を名指しする）
    hasJitsuzaiNote: !!d.getElementById("jitsuzai-note"),
    // ★個人事業者の番号を「誤り」と断定していないこと
    hasKojinHint: !!d.getElementById("kojin-hint"),
    kojinHintText: d.getElementById("kojin-hint")?.textContent ?? "",
    empty: !!d.getElementById("empty-note"),
    body,
  };
};

// ── 小規模宅地等の特例 (/shokibo-takuchi/) ─────────────────────────────────
// ★単体（tests/test_shokibo_takuchi.mjs）は core しか見ないので、「3区分の面積・評価額の読み取り→
//   2つの限度面積ルールの比較→配分→内訳表と比較表の描画」の配線はここでしか守れない。
//   期待値の手計算は同テストの §4（条文書き下しオラクルと全域照合つき）。
const shokiboScene = (o) => async () => {
  const doc = await open("/docs/shokibo-takuchi/");
  // 既定値もページの一部（利用者が最初に見る画面）。空でないことを機械で確かめる。
  const defaultJutakuArea = doc.getElementById("jutakuArea").value;
  const defaultJutakuValue = doc.getElementById("jutakuValue").value;
  set(doc, "jutakuArea", o.jutakuArea ?? 330);
  set(doc, "jutakuValue", o.jutakuValue ?? 99000000);
  set(doc, "jigyoArea", o.jigyoArea ?? 400);
  set(doc, "jigyoValue", o.jigyoValue ?? 80000000);
  set(doc, "kashitsukeArea", o.kashitsukeArea ?? 200);
  set(doc, "kashitsukeValue", o.kashitsukeValue ?? 100000000);
  click(doc, "calc"); // ← 参照データの到着を待たずに押す（実ユーザーと同じ）

  await waitFor(
    () => /¥|読み込めませんでした|入力してください/.test(text(doc, "result")),
    "小規模宅地等の特例の計算結果",
  );
  const body = text(doc, "result");
  const num = (re) => { const m = body.match(re); return m ? Number(m[1].replace(/,/g, "")) : null; };
  const byId = (id) => { const e = doc.getElementById(id); return e ? e.textContent.trim() : null; };
  const yen = (id) => { const t = byId(id); return t ? Number(t.replace(/[^\d]/g, "")) : null; };
  // 内訳表を区分ごとに読む（描画の配線を名指しで確かめる）
  const rows = [...(doc.querySelectorAll("#result table tbody tr") || [])].map((tr) =>
    [...tr.querySelectorAll("td")].map((e) => e.textContent.trim()));
  // 法の列挙が実際に画面に出ているか（静的HTMLだが、E2Eでも「見えていること」を確かめる）
  const ienakiko = [...(doc.querySelectorAll("#ienakiko-list li") || [])].map((e) => e.textContent.trim());
  const shutokusha = [...(doc.querySelectorAll("#jutaku-shutokusha tbody tr") || [])].length;
  const homeConds = [...(doc.querySelectorAll("#home-list li") || [])].length;
  return {
    defaultJutakuArea: Number(defaultJutakuArea) || 0,
    defaultJutakuValue: Number(defaultJutakuValue) || 0,
    reduction: num(/特例で減額される金額 ¥([\d,]+)/),
    after: num(/特例適用後の宅地等の価額 ¥([\d,]+)/),
    before: num(/（特例前 ¥([\d,]+)/),
    pattern: byId("pattern-name"),
    genkakuJutaku: yen("genkaku-jutaku"),
    genkakuJigyo: yen("genkaku-jigyo"),
    genkakuKashitsuke: yen("genkaku-kashitsuke"),
    hikakuA: yen("hikaku-a"),
    hikakuB: yen("hikaku-b"),
    judge: byId("hikaku-judge"),
    rows,
    ienakikoCount: ienakiko.length,
    ienakikoHasHaigusha: ienakiko.some((s) => s.includes("被相続人に配偶者がいないこと")),
    shutokushaRows: shutokusha,
    homeConds,
    failed: body.includes("読み込めませんでした"),
    noInput: body.includes("入力してください"),
    body,
  };
};

// ★単体（tests/test_kotei_shisanzei.mjs）は core しか見ないので、

//   配線はここでしか守れない。期待値の手計算は同テストの §3〜§5。
// ★新築の区分の <select> は SHINCHIKU_KUBUN から**スクリプトで**組み立てているので、
//   選択肢が0個になる配線事故（＝画面から列挙が消える）もここで捕まえる。
const koteiScene = (o) => async () => {
  const doc = await open("/docs/kotei-shisanzei/");
  const defaultLandValue = doc.getElementById("landValue").value;
  const shinchikuOptions = [...doc.querySelectorAll("#shinchiku option")].map((e) => e.value);
  set(doc, "landValue", o.landValue ?? 18000000);
  set(doc, "landArea", o.landArea ?? 150);
  set(doc, "isResidential", o.isResidential ?? "1");
  set(doc, "units", o.units ?? 1);
  set(doc, "houseValue", o.houseValue ?? 8000000);
  set(doc, "houseFloorArea", o.houseFloorArea ?? 100);
  set(doc, "shinchiku", o.shinchiku ?? "none");
  if (o.koteiRate !== undefined) set(doc, "koteiRate", o.koteiRate);
  if (o.toshiRate !== undefined) set(doc, "toshiRate", o.toshiRate);
  // 税率の既定値はコアの定数から描かれる（ページに手書きしない）ので、押す前に読んでおく
  const rateDefaults = {
    kotei: Number(doc.getElementById("koteiRate").value),
    toshi: Number(doc.getElementById("toshiRate").value),
  };
  click(doc, "calc");

  await waitFor(
    () => /¥|入力してください/.test(text(doc, "result")),
    "固定資産税の計算結果",
  );
  const body = text(doc, "result");
  const byId = (id) => { const e = doc.getElementById(id); return e ? e.textContent.trim() : null; };
  const yen = (id) => { const t = byId(id); return t ? Number(t.replace(/[^\d]/g, "")) : null; };
  const rows = [...(doc.querySelectorAll("#result table tbody tr") || [])].map((tr) =>
    [...tr.querySelectorAll("td")].map((e) => e.textContent.trim()));
  return {
    defaultLandValue: Number(defaultLandValue) || 0,
    shinchikuOptions,
    rateDefaults,
    total: yen("total"),
    koteiTotal: yen("kotei-total"),
    toshiTotal: yen("toshi-total"),
    term1: yen("term1"),
    genkaku: byId("shinchiku-tekiyo"),
    genkakuGai: byId("shinchiku-gai"),
    juubaiNote: byId("juubai-note"),
    rows,
    noInput: body.includes("入力してください"),
    body,
  };
};

  const win = doc.defaultView;

    memberCount: members.length,

    shien: yen("kubun-shien"),

    failed: /読み込めませんでした/.test(body),
    body,
  };
};

// ★これは「計算ツール」ではなく「利用者の票が合っているかを申告する検算器」なので、
//   守る向きは1つに絞れる: **合っていないのに『合っています』と答えないこと**。
const gensenKojoScene = (o) => async () => {
  const doc = await open("/docs/column/gensen-choshuhyo-mikata/");
  set(doc, "k-shakai", o.shakai ?? 750000);
  set(doc, "k-seimei", o.seimei ?? 40000);
  set(doc, "k-jishin", o.jishin ?? 20000);
  set(doc, "k-haigusha", o.haigusha ?? 380000);
  set(doc, "k-shinzoku", o.shinzoku ?? 0);
  set(doc, "k-kiso", o.kiso ?? 580000);
  set(doc, "k-tokutei", o.tokutei ?? 1);
  set(doc, "k-ippan", o.ippan ?? 1);
  set(doc, "k-rojin", o.rojin ?? 0);
  set(doc, "k-dokyorojin", o.dokyoRojin ?? 0);
  set(doc, "k-shogai", o.shogai ?? 0);
  set(doc, "k-tokubetsu", o.tokubetsu ?? 0);
  set(doc, "k-dokyotoku", o.dokyoToku ?? 0);
  set(doc, "k-san", o.san ?? 2780000);
  click(doc, "k-calc");

  await waitFor(
    () => /¥|入れてください|読み込めませんでした/.test(text(doc, "k-result")),
    "③の検算結果",
  );
  const body = text(doc, "k-result");
  const byId = (id) => { const e = doc.getElementById(id); return e ? e.textContent.trim() : null; };
  const yen = (id) => {
    const t = byId(id);
    if (!t || !/\d/.test(t)) return null;
    const n = Number(t.replace(/[^\d]/g, ""));
    return /^−/.test(t) ? -n : n;   // ★マイナスの差額を符号ごと読む（0に化けたら落とす）
  };
  return {
    accounted: yen("k-accounted"),
    san: yen("k-san-out"),
    remainder: yen("k-remainder"),
    matched: byId("k-matched"),
    overshoot: byId("k-overshoot"),
    explains: byId("k-explains"),
    explainCount: doc.querySelectorAll("#k-explain-list li").length,
    unexplained: byId("k-unexplained"),
    miNyuryoku: byId("k-mi-nyuryoku"),
    loadFailed: byId("k-load-failed"),
    notes: [...doc.querySelectorAll("#k-notes li")].map((li) => li.getAttribute("data-note")).join(","),
    nendo: byId("k-src"),
    failed: /読み込めませんでした/.test(body),
    body,
  };
};

const inshiScene = ({ doc = "k17_uriage", amount = "", taxPart = 0, menzei = false }) => async () => {
  const d = await open("/docs/inshi/");
  if (doc !== "k17_uriage") {
    const el = d.getElementById("doc");
    el.value = doc;
    el.dispatchEvent(new d.defaultView.Event("change", { bubbles: true }));

  const body = text(d, "result");
  const num = (re) => { const m = body.match(re); return m ? Number(m[1].replace(/,/g, "")) : null; };

    doc, amount,
    tax: num(/必要な収入印紙[^¥]*¥([\d,]+)/),      // 課税のときの印紙額
    hikazei: /収入印紙は不要です（非課税）/.test(body),

    tableRows: d.querySelectorAll("#zeigaku-table tbody tr").length,

    body,
  };
};

// ★取得価額・耐用年数・償却方法から償却スケジュールを計算。独立オラクル=国税庁 No.2106/別表第十の
//   公表計算例（100万円・耐用年数10年）。定額法=毎年10万、200%定率法=1年目20万→7年目改定65,536→10年目65,535。
//   コアは一切通さず、結果表の「償却費」列（<b>）を読み取って公表値と照合する。
const genkaScene = ({ method = "teigaku", cost = 1000000, life = 10, year = 2015, month = 1, ratio = 100, assetType = "yukei" }) => async () => {
  const d = await open("/docs/genka/");
  if (method !== "teigaku") set(d, "method", method);
  if (assetType !== "yukei") set(d, "assettype", assetType);
  set(d, "cost", String(cost));
  set(d, "life", String(life));
  set(d, "acqyear", String(year));
  set(d, "acqmonth", String(month));
  if (ratio !== 100) set(d, "ratio", String(ratio));
  click(d, "calc"); // ← 参照データの到着を待たずに押す（実ユーザーと同じ）

  await waitFor(
    () => /の償却費|読み込めませんでした|計算できませんでした/.test(text(d, "result")),
    "減価償却の計算結果",
  );
  const body = text(d, "result");
  const num = (re) => { const m = body.match(re); return m ? Number(m[1].replace(/,/g, "")) : null; };
  // 結果のスケジュール表の「償却費」列（太字<b>のtd）を配列で取る。改定切替・備忘1円をここで照合。
  const resultTable = d.querySelector("#result table");
  const depCol = resultTable
    ? [...resultTable.querySelectorAll("tbody tr")].map((tr) => {
        const b = tr.querySelector("td b");
        return b ? Number(b.textContent.replace(/[^\d]/g, "")) : null;
      })
    : [];
  // 結果表の最終行の「期末帳簿価額」（＝最後に残る額。有形1円／無形・坑道0円）
  const lastRow = resultTable ? [...resultTable.querySelectorAll("tbody tr")].pop() : null;
  const lastCells = lastRow ? [...lastRow.querySelectorAll("td")] : [];
  const lastCloseBook = lastCells.length
    ? Number(lastCells[lastCells.length - 1].textContent.replace(/[^\d]/g, "")) : null;
  return {
    method, cost, life, assetType,
    firstYear: num(/の償却費\s*¥([\d,]+)/),                 // 初年度の償却費（見出し）
    total: num(/償却費の合計\s*¥([\d,]+)/),                  // 合計＝取得価額−1円
    lastCloseBook,
    necessary: num(/必要経費に算入できる額（事業専用割合\d+％）＝\s*¥([\d,]+)/), // 事業割合<100のとき
    rows: resultTable ? resultTable.querySelectorAll("tbody tr").length : 0,
    depCol,
    ritsuRows: d.querySelectorAll("#ritsu-table tbody tr").length, // 償却率一覧表（2〜50年=49行）
    failed: body.includes("読み込めませんでした"),   // 参照データ配信不可（fail closed）
    rejected: body.includes("計算できませんでした"),  // 旧法・不正入力の拒否（fail closed）
    body,
  };
};

// ── 年収の壁 (/kabe/) ─────────────────────────────────────────────────────
// ★このツールは shaho_core.calcMonthly の合成。E2Eは「年収→壁判定→社保→手取り」の配線を見る。
//   独立オラクル: 社会保険料 = 協会けんぽ額表の各項目(健保±介護/子育て支援金/厚年)を50銭以下切捨で
//   丸めて合算 ×12（雇用保険は含めない＝壁の前後で増減しないため。記事の手取り定義と同じ）。
//   ★kabe_core を一切通さず、fixture の折半額と端数処理だけから積む（被検体と別実装）。
const round58 = (h) => (h - Math.floor(h) > 0.5 ? Math.ceil(h) : Math.floor(h)); // 50銭超で切上・以下切捨
const kabeSiAnnual = (kenpo, std, age) => {
  const g = kenpo.grades.find((x) => x.standard === std);
  const kaigo = age >= 40 && age < 65;
  const monthly = round58(kaigo ? g.kenko_kaigo_half : g.kenko_half) + round58(g.kosodate_half) + round58(g.kosei_half);
  return monthly * 12;
};
const kabeScene = ({ annual, age = 30, pref = "東京都", wall = "hifuyousha", wallAmt, std }) => async () => {
  const doc = await open("/docs/kabe/");
  const kenpo = await (await fetch("/tests/fixtures/kyoukaikenpo_tokyo_r08.json?raw=1")).json();
  await waitFor(() => doc.querySelector('#pref option[value="東京都"]'), "都道府県の選択肢");
  set(doc, "pref", pref);
  pickRadio(doc, "wall", wall);
  set(doc, "age", String(age));
  set(doc, "annual", String(annual));
  click(doc, "calc"); // 参照データの到着を待たずに押す(実ユーザーと同じ)

  await waitFor(
    () => /扶養内|いまの手取り|読み込めませんでした|入力してください/.test(text(doc, "result")),
    "年収の壁の計算結果");
  const body = text(doc, "result");
  const num = (re) => { const m = body.match(re); return m ? Number(m[1].replace(/,/g, "")) : null; };

  // ── ハーネス側の独立オラクル ──
  const joins = annual >= wallAmt;
  const si = joins ? kabeSiAnnual(kenpo, std, age) : 0;     // 加入時のみ社保。std は当該年収の標準報酬月額
  const expectedTedori = annual - si;
  const expectedBottom = wallAmt - kabeSiAnnual(kenpo, std, age); // 壁ちょうどで加入した手取り(底)

  return {
    annual, wall, joins,
    current: num(/いまは扶養内 ¥([\d,]+)/),                 // 扶養内(未加入)のとき
    tedori: num(/いまの手取り ¥([\d,]+)/),                  // 加入者のとき
    bottom: num(/手取りは¥([\d,]+)まで下がります/),
    shaho: num(/社会保険料 ¥([\d,]+)／年/),
    recoveryShown: num(/元の手取りに戻る年収 ¥([\d,]+)/),
    expectedTedori, expectedBottom, expectedSi: si,
    failed: body.includes("読み込めませんでした"),
    body,
  };
};

//    ここを「30日ずつ」で数えていたため、**本番で1年あたり25,100円 過大に答えていた**。
//    正体は「2つの日数が別の数え方で動く」こと:
//      支給日数（いくら払うか）… 終了月**以外**は**一律30日**（6項1号）。暦31日の月でも30日、暦28日の2月でも30日
//      休業日数（67%→50%の境目）… **暦の通算**。180日目 = 開始日+179日
//    → 暦31日の月では支給日数が1日ぶん遅れる。**「180日目」が来ても67%はまだ177日しか払われていない**。
//
//   [月給30万・賞与なし・**2026-04-01**開始・365日]  賃金日額 = 300,000×6 ÷ 180 = **10,000円**
//     1〜5回目（4/1〜8/31）… 各30日 × 67% = 201,000円/月 → 1,005,000円
//     ★6回目（9/1〜9/30）… 180日目は**9/27**。27日×67%(180,900) + 3日×50%(15,000) = **195,900円**（日割り）
//     7〜11回目（10/1〜2/28）… 各30日 × 50% = 150,000円/月 → 750,000円（★2月も暦28日だが30日分）
//     12回目（3/1〜3/31・終了月）… 実日数31日 × 50% = **155,000円**（2号。ここだけ30日で切らない）
//     合計 = **2,105,900円**（67%は177日 / 50%は184日 / 支給日数の合計361日）
//   ⚠️「30日ずつ」モデルなら 2,131,000円。**この差25,100円がまさに直したバグ**。
//
//   [★★13%（出生後休業支援給付金）が画面に届いているか]
//     10,000 × 28 × 0.13 = **36,400円**
//     ★★これは **ページが shien を渡し忘れると黙って消える**行だった（コアの引数が省略可能だったため）。
//        第23便(/furusato/ の fuyoNensho)・第25便(/shobyo/ の startDate)と**同じ型の事故が3便連続**。
//        → コア側は shien を**必須引数**にして省略を殺した（渡し忘れれば例外になる）。
//        → ページ側は13%の行を**常に描く**（乗るなら金額、乗らないなら理由）。
//        **無い行は、レビューでも本番でも見えない**ので、「行が消える」余地そのものを消してある。
//        このシーンは、その錠前が実際に効いていることを**画面の実額**で固定する。
const ikujiScene = (inp) => async () => {
  const doc = await open("/docs/ikuji/");
  set(doc, "monthly", String(inp.monthly ?? 300000));
  // ★開始日は**過去の固定日**にする（「今日」に依存させない＝実行日で落ちたり通ったりしない）
  set(doc, "startDate", inp.startDate ?? "2026-04-01");
  set(doc, "leaveDays", String(inp.leaveDays ?? 365));
  set(doc, "shienOwnDays", String(inp.shienOwnDays ?? 28));
  set(doc, "shienSpouseDays", String(inp.shienSpouseDays ?? 0));
  if (inp.spouseExempt) check(doc, "spouseExempt", true);
  click(doc, "calc"); // ← 参照データの到着を待たずに押す（実ユーザーと同じ）

  await waitFor(
    () => /育児休業給付 ¥|読み込めませんでした|入力してください/.test(text(doc, "result")),
    "育児休業給付金の計算結果",
  );
  const body = text(doc, "result");
  const num = (re) => { const m = body.match(re); return m ? Number(m[1].replace(/,/g, "")) : null; };

  return {
    ...inp,
    // ★th と td の textContent は**空白なしで連結**される（第18便）ので空白を要求しない
    total: num(/育児休業給付 ¥([\d,]+)/),
    ikujiTotal: num(/育児休業給付金（67%／50%）¥([\d,]+)/),
    daily: num(/賃金日額 ¥([\d,]+)/),
    // ★★13%の実額が**画面に出ている**こと（渡し忘れならこの行は0円か、行ごと消える）
    shien: num(/出生後休業支援給付金（＋13%）¥([\d,]+)/),
    // 13%が乗らないときは、**なぜ乗らないか**を画面が名指しで言うこと（黙って0円にしない）
    showsSpouseReason: /配偶者の出生後休業が14日未満/.test(body),
    showsSpouseHint: /配偶者が14日以上の育児休業を取れば、13%（最大28日分）が上乗せされます/.test(body),
    // ★上限は年齢で変わらない（61条の7第6項＝17条4項2号ハ）
    showsCap: /賃金日額が上限（¥16,110）に張りついています/.test(body),
    // ★★支給単位期間が**実際の日付**で出ていること（＝ページが startDate をコアに渡している証拠）。
    //   渡し忘れればコアが例外を投げるので、そもそもここまで来ない（構造的な錠前）。
    unit1: num(/1回目2026-04-01〜2026-04-30¥([\d,]+)/),
    unit7: num(/7回目2026-10-01〜2026-10-31¥([\d,]+)/),
    // ★★180日目（9/27）をまたぐ回の**日割り**が、実額で画面に出ていること。
    //   前便までこの分岐は**利用者の入力から到達不能**だった（30日区切りでは180=6×30で必ず境界に乗るため）。
    //   暦の応当日で区切って、はじめて**本当に検査される**。
    straddleAmount: num(/6回目2026-09-01〜2026-09-30¥([\d,]+)/),
    showsHiwari: /支給日数30日・67%と50%の日割り（27日＋3日）/.test(body),
    // ★暦28日の2月でも**支給日数は30日**（6項1号）。暦との食い違いを画面が自分から開示すること
    //   ⚠️金額と支給日数の間は全角空白（U+3000）だが、text() の \s+ 正規化で**半角空白1個に潰れる**
    //     （JSの \s は U+3000 にも当たる）。ここを全角空白で書くと**永久に false** になる。
    showsFebPayDays: /11回目2027-02-01〜2027-02-28¥150,000\s*支給日数30日（暦は28日）・50%/.test(body),
    // ★終了月だけは実日数（6項2号）。31日を30日に切らない
    showsFinalPayDays: /12回目2027-03-01〜2027-03-31¥155,000\s*支給日数31日・50%/.test(body),
    // ★★67%で払われる日数が**180日ではなく177日**であることを、画面が自分から言うこと
    showsPayDays67: /67%で払われる日数は 177日/.test(body),
    failed: body.includes("読み込めませんでした"),
    body,
  };
};

// ★看板の答え: 月給30万・2026-04-01から1年の育休 → **2,105,900円**（67%は177日・50%は184日）
//   13%は**配偶者が育休を取らないので0円**（既定）。その理由が画面に出ることまで見る
SCENES.ikuji = ikujiScene({});
// ★★開始日で答えが変わることを**画面で**固定する（＝ページが startDate を本当に使っている証拠）。
//   2026-02-01開始は、短い2月（暦28日）が31日の月を相殺するので 67%が**180日フル**になり、
//   同じ月給・同じ365日でも合計は **2,116,000円**（4/1開始の2,105,900円と10,100円違う）。
//   ★もしページが開始日を無視して30日ずつ区切っていたら、この2つは同額になってここで落ちる。
SCENES.ikuji_feb = ikujiScene({ startDate: "2026-02-01" });
// ★★13%が乗る場合。配偶者も28日取る → 10,000×28×0.13 = **36,400円**が画面に出ること。
//   **ページが shien を渡し忘れていたら、この36,400円は画面に現れない**（＝このシーンが落ちる）
SCENES.ikuji_shien = ikujiScene({ shienSpouseDays: 28 });
// ★ひとり親等は配偶者要件が免除される（61条の10第2項）→ 配偶者0日でも13%が乗る
SCENES.ikuji_hitorioya = ikujiScene({ shienSpouseDays: 0, spouseExempt: true });
// ★上限に張りつく人（月給60万 → 賃金日額20,000円だが16,110円で頭打ち）。
//   ★★45歳以上でも17,740円にならない・30歳未満でも14,510円に下げられない（年齢を聞いていない）
//   67%の上限 = 16,110 × 30 × 0.67 = **323,811円/月**（厚労省の公表する支給限度額そのもの）
SCENES.ikuji_cap = ikujiScene({ monthly: 600000, leaveDays: 180 });
// 参照データを配信できない → 金額を出さずに断ること（fail closed）。
// ★黙って答えると、上限に張りつく人に**上限を無視した高い額**を信じさせる（月30万円以上ずれる）
SCENES.ikuji_nodata = ikujiScene({ monthly: 600000, nodata: true });

// ═══════════════════════════════════════════════════════════════════════════
// 産後パパ育休（/papa-ikukyu/）— 61条の8 ＋ 61条の10
//
// ★★期待値は **厚労省「育児休業等給付の内容と支給申請手続」(001461102.pdf) 5頁の計算例**。
//    実装を一切通さず、資料に印刷された金額をそのまま焼き付ける（外部オラクル）。
//      賃金日額10,000円・14日 → 67%: **93,800円** / 13%: **18,200円**
//      同・3日就労で賃金30,000円 → 67%: 112,000−30,000 = **82,000円** / 13%: **18,200円**（減額なし）
//
// ★★このページの主役は **配偶者要件の免除（61条の10第2項3号）**。
//    父親は妻が産後休業中なので、**妻が育休を1日も取らなくても13%が乗る**。
//    ページの既定の選択（「配偶者が出産した」）が、コアに exempt:true を**本当に渡しているか**を
//    画面の実額（18,200円）で固定する。渡し忘れれば「配偶者の育児休業が14日未満」で0円になり落ちる。
// ═══════════════════════════════════════════════════════════════════════════
const papaScene = (inp) => async () => {
  const doc = await open("/docs/papa-ikukyu/");
  set(doc, "monthly", String(inp.monthly ?? 300000)); // 賃金日額 10,000円
  set(doc, "leaveDays", String(inp.leaveDays ?? 14));
  set(doc, "wage", String(inp.wage ?? 0));
  if (inp.spouse) set(doc, "spouse", inp.spouse);
  if (inp.spouseDays !== undefined) set(doc, "spouseDays", String(inp.spouseDays));
  click(doc, "calc"); // ← 参照データの到着を待たずに押す（実ユーザーと同じ）

  await waitFor(
    () => /産後パパ育休の給付 ¥|読み込めませんでした|入力してください/.test(text(doc, "result")),
    "産後パパ育休の計算結果",
  );
  const body = text(doc, "result");
  const num = (re) => { const m = body.match(re); return m ? Number(m[1].replace(/,/g, "")) : null; };

  return {
    ...inp,
    total: num(/産後パパ育休の給付 ¥([\d,]+)/),
    shusshoji: num(/出生時育児休業給付金（67%）¥([\d,]+)/),
    // ★13%の行は**常に描かれる**（乗るなら金額・乗らないなら理由）。渡し忘れで行が消える余地を残さない
    shien: num(/出生後休業支援給付金（＋13%）¥([\d,]+)/),
    daily: num(/賃金日額 ¥([\d,]+)/),
    // ★★産後パパ育休の日数が、そのあとの育休の180日枠を食うことを画面が自分から言うこと
    remaining67: num(/67%が続くのは残り(\d+)日/),
    // 13%が乗らないときは**なぜ乗らないか**を名指しで言う（黙って0円にしない）
    showsOwnDaysReason: /あなたの休業が14日未満/.test(body),
    showsCliffHint: /13%（約¥18,200）がまるごと乗ります/.test(body),
    // ★★「延ばせば乗る」を**言ってはいけない場合**（2026-07-26 に本番で誤案内していた）:
    //   shienKyufu は**自分の日数を先に見て**返すので、配偶者も14日未満の人にも own_days を返す。
    //   ページがそれをそのまま「あと1日で18,200円乗る」と案内すると、
    //   **休業を1日延ばしても1円も増えない人**に、職場調整を伴う決断を促すことになる。
    showsCliffBlocked: /延ばすだけでは、13%は1円も出ません/.test(body),
    showsSpouseReason: /配偶者の育児休業が14日未満/.test(body),
    // ★賃金で67%が減っても13%は減らないことを画面が明示する
    showsWageReduced: /出生後休業支援給付金（13%）は減額されません/.test(body),
    // ★★80%以上working → 67%不支給。**13%も道連れで消える**（条文に無い規則・厚労省5頁）
    showsUnpaidBoth: /出生後休業支援給付金（13%）も\s*支給されません/.test(body),
    showsCap: /賃金日額が上限（¥16,110）に張りついています/.test(body),
    showsDaysCap: /支給の対象は28日までです/.test(body),
    failed: body.includes("読み込めませんでした"),
    body,
  };
};

// ★看板の答え（厚労省5頁の計算例①）: 月給30万・14日・賃金なし・妻が産後休業中
//   → 67%: 93,800円 / 13%: 18,200円 / 合計 112,000円（＝80%）
//   ★★13%が乗るのは、ページが「配偶者が出産した＝産後休業中」を exempt として渡しているから。
//     渡し忘れれば「配偶者の育児休業が14日未満」で0円になり、このシーンが落ちる。
SCENES.papa = papaScene({});
// ★★厚労省5頁の計算例②: 3日就労して賃金30,000円 → 67%は82,000円に減るが、**13%は18,200円のまま**
SCENES.papa_wage = papaScene({ wage: 30000 });
// ★★賃金が80%相当額（112,000円）以上 → 67%は不支給。**13%も支給されない**（厚労省5頁）。
//   条文（61条の10）には賃金調整の規定が無いので、条文だけ読むと13%は出ると読める。**それは誤り**。
SCENES.papa_unpaid = papaScene({ wage: 112000 });
// ★14日の崖: 13日では13%が1円も出ない（61条の10第1項2号）。あと1日で18,200円乗ることを画面が言う
SCENES.papa_13days = papaScene({ leaveDays: 13 });
// ★免除に当てはまらない人（子が養子など）は、配偶者が14日以上取らないと13%は0円
SCENES.papa_no_exempt = papaScene({ spouse: "employed", spouseDays: 0 });
// ★★自分も配偶者も14日未満（免除なし）。コアは own_days を返すが、
//   **自分だけ14日にしても配偶者が足りないので13%は0円のまま**。
//   「あと1日で18,200円乗る」と言ってはいけない場面（2026-07-26の修正）。
SCENES.papa_13days_no_exempt = papaScene({ leaveDays: 13, spouse: "employed", spouseDays: 10 });
// ★28日で頭打ち（61条の8第2項2号）＋上限に張りつく人 → 67%: 302,223円 / 13%: 58,640円（厚労省の公表値）
SCENES.papa_cap = papaScene({ monthly: 600000, leaveDays: 40 });
// 参照データを配信できないときは、金額を出さずに断る（fail closed）
SCENES.papa_nodata = papaScene({ nodata: true });

// ── 住宅ローン控除（/jutaku/） 措置法41条・国税庁 No.1211-1 ────────────────
// ★期待値は jutaku_core.js を一切通さず、国税庁 No.1211-1 が公表する控除限度額と条文の率から積む。
//   借入限度額 × 0.7%（100円未満切捨）。認定・令和6年（一般）は借入4,500万 → **31.5万円/年**。
//   ★このツールの主役の事実: 「その他の住宅」を令和6・7年に入居した人は**原則0円**（借入限度額0円）。
//   ページが year/kubun/経過措置/特例のフラグをコアに渡し忘れると、この0円や上乗せが黙って崩れる。
const jutakuScene = (inp) => async () => {
  const doc = await open("/docs/jutaku/");
  set(doc, "type", inp.type ?? "shinchiku");
  set(doc, "kubun", inp.kubun ?? "shoene");
  set(doc, "year", String(inp.year ?? 2025));
  set(doc, "zandaka", String(inp.zandaka ?? 30000000));
  set(doc, "taika", inp.taika != null ? String(inp.taika) : "");
  set(doc, "shotoku", inp.shotoku != null ? String(inp.shotoku) : "");
  set(doc, "menseki", inp.menseki != null ? String(inp.menseki) : "");
  set(doc, "shotokuzei", inp.shotokuzei != null ? String(inp.shotokuzei) : "");
  set(doc, "kazei", inp.kazei != null ? String(inp.kazei) : "");
  if (inp.tokurei) check(doc, "tokurei", true);
  if (inp.keika) check(doc, "keika", true);
  click(doc, "calc"); // ← 参照データの到着を待たずに押す（実ユーザーと同じ）

  await waitFor(
    () => /控除額|計算できません|読み込めませんでした|入力してください/.test(text(doc, "result")),
    "住宅ローン控除の計算結果",
  );
  const body = text(doc, "result");
  const num = (re) => { const m = body.match(re); return m ? Number(m[1].replace(/,/g, "")) : null; };
  return {
    ...inp,
    nenkan: num(/控除額（1年あたり・上限）¥([\d,]+)/),
    soKoujo: num(/総控除額（上限のめやす）¥([\d,]+)/),
    kikan: num(/控除期間(\d+)年/),
    // ★「その他の住宅」令和6・7年 → 原則0円。その理由と経過措置の逃げ道を必ず画面に出す
    zero: /控除の対象になりません/.test(body),
    showsSonotaZero: /「その他の住宅」を.*入居したため、原則として控除の対象になりません/.test(body),
    showsKeikaHint: /「経過措置に該当する」にチェック/.test(body),
    // ★経過措置を適用 → 借入2,000万・10年で復活したことを名乗る
    showsKeikaApplied: /「その他の住宅」の経過措置を適用しました/.test(body),
    // ★子育て世帯等の上乗せを適用したことを名乗る
    showsTokurei: /子育て世帯・若者夫婦世帯（特例対象個人）の上乗せを適用/.test(body),
    // ★中古（既存住宅）として計算したことを名乗る（新築と別レジーム）
    showsChuko: /中古（既存住宅）として計算しています|中古（既存住宅）・/.test(body),
    // ★増改築・想定外の取得のしかたは黙って答えない（fail closed）＝「この計算機では計算できません」
    showsCannotCompute: /この計算機では計算できません/.test(body),
    // ★総控除額は「上限のめやす」であって満額戻る額ではないことを画面が言う
    showsGaisan: /上限のめやす/.test(body),
    // ★所得税額を入れたときだけ出る「実際に戻る税額」の内訳（総務省の一次情報どおり）
    showsRefund: /実際に戻る税額（合計）/.test(body),
    jitsuGenzei: num(/実際に戻る税額（合計）¥([\d,]+)/),
    refundShotokuzei: num(/所得税から引かれる額¥([\d,]+)/),
    refundJuminzei: num(/住民税から引かれる額¥([\d,]+)/),
    kirisute: num(/控除枠のうち戻らない額（切り捨て）¥([\d,]+)/),
    // ★課税総所得未入力 → 上限97,500円で概算した旨を必ず名乗る（黙って多めに言わない）
    showsCapUnknown: /「課税総所得金額等」が未入力のため/.test(body),
    // ★所得税額を入れていないときは、入れれば実額が分かる案内を出す
    showsRefundPrompt: /実際に戻る（軽減される）税額を知りたいときは/.test(body),
    failed: /読み込めませんでした/.test(body),
    body,
  };
};

  return {

// ひとり親控除・寡婦控除の共通ドライバ。ラジオ・チェックは**利用者と同じ操作**で選ぶ。
async function hitorioyaScene(doc, opts) {
  await waitFor(() => doc.getElementById("marital-rikon"), "ひとり親控除の入力欄の読み込み");
  if (opts.marital) click(doc, "marital-" + opts.marital);
  if (opts.sex) click(doc, "sex-" + opts.sex);
  if (opts.child) click(doc, "child-" + opts.child);
  if (opts.otherFuyo) click(doc, "other-fuyo");
  if (opts.jijitsukon) click(doc, "jijitsukon");
  if (opts.mode) click(doc, "income-mode-" + opts.mode);
  set(doc, "income", String(opts.income));
  if (opts.kazei != null) set(doc, "kazei", String(opts.kazei));
  click(doc, "calc");
  await waitFor(() => { const t = text(doc, "result"); return t && !/計算中/.test(t); }, "ひとり親控除の判定結果");
  const body = text(doc, "result");
  return {
    label: (body.match(/あなたは\s*(ひとり親控除|寡婦控除)/) || [])[1] || (/判定\s*対象外/.test(body) ? "対象外" : ""),
    total: setsuzeiNum(body, /年間の節税額 ¥([\d,]+)/),
    juminGen: setsuzeiNum(body, /住民税の減少[^¥—]*¥([\d,]+)/),
    gokei: setsuzeiNum(body, /合計所得金額¥([\d,]+)/),
    overLine: setsuzeiNum(body, /このラインを¥([\d,]+)超えています/),
    hikazei: /あなたの住民税は全額かかりません/.test(body),
    juminDash: /住民税の減少（所得割10%・概算）\s*—（下の注）/.test(body),
    showsNoJuminNote: /控除の出番はありません/.test(body),
    reason: body,
    failed: body.includes("読み込めませんでした"),
  };
}

// 勤労学生控除の共通ドライバ。ラジオ・チェックは**利用者と同じ操作**で選ぶ。
async function kinroGakuseiScene(doc, opts) {
  await waitFor(() => doc.getElementById("school-ichijo"), "勤労学生の入力欄の読み込み");
  if (opts.school) click(doc, "school-" + opts.school);
  if (opts.miseinen) click(doc, "miseinen");
  set(doc, "kyuyo", String(opts.kyuyo));
  if (opts.kinroSonota != null) set(doc, "kinro-sonota", String(opts.kinroSonota));
  if (opts.hikinro != null) set(doc, "hikinro", String(opts.hikinro));
  if (opts.shaho != null) set(doc, "shaho", String(opts.shaho));
  click(doc, "calc");
  await waitFor(() => { const t = text(doc, "result"); return t && !/計算中/.test(t); }, "勤労学生の判定結果");
  const body = text(doc, "result");
  return {
    hantei: /判定\s*勤労学生控除の対象です/.test(body) ? "ok"
      : /判定\s*対象外/.test(body) ? "none"
      : /控除の出番はありません/.test(body) ? "noeffect" : "",
    juminOff: setsuzeiNum(body, /住民税[^)]*\)\s*¥([\d,]+) →/),
    juminOn: setsuzeiNum(body, /→ ¥([\d,]+)/),
    saving: setsuzeiNum(body, /▲¥([\d,]+)/),
    zeroCallout: /あなたの所得税は、勤労学生控除がなくても0円です/.test(body),
    zeroRow: /0円 → 0円/.test(body),
    courseNote: /勤労学生控除の証明書/.test(body),
    hikazeiMiseinen: /もともと全額非課税なので、控除の出番はありません/.test(body),
    oyaHazure: /親の扶養控除の対象からは外れています/.test(body),
    reason: body,
    failed: body.includes("読み込めませんでした"),
  };
}

// ── /embed/ ウィジェットのパリティ検証(2026-07-20) ──────────────────────────────
// 本体ページと埋め込みウィジェットに**同じ入力**を与え、利用者に見えている見出し値(.big)が
// 一致することを確かめる。期待値の正しさは本体側の各シーン(一次情報オラクル)が担保して
// いるので、ここでは期待値をもう一組持たない(二重管理は必ず腐る)。読むのは**可視**の
// .big だけ — textContent の素読みは display:none を素通しする(§46)。
const visibleEl = (doc, el) => {
  const win = doc.defaultView;
  for (let n = el; n && n.nodeType === 1; n = n.parentElement) {
    const cs = win.getComputedStyle(n);
    if (cs.display === "none" || cs.visibility === "hidden") return false;
  }
  return true;
};
const bigsIn = (doc, id) => {
  const root = doc.getElementById(id);
  if (!root || !visibleEl(doc, root)) return null;   // 結果ボックス自体が非表示 = 全損の型
  return [...root.querySelectorAll(".big")].filter((el) => visibleEl(doc, el))
    .map((el) => el.textContent.replace(/\s+/g, " ").trim());
};
// 見出し値の正規化: 「¥239,610」と「239,610円」は同じ数なので**最初の数値トークン**で比べる
// (本体の見出しは「¥2,105,900（〜2027-03-31・365日）」のように補足を同じ要素に含むことがあり、
// 数字の全連結だと本体とembedの補足の差で偽赤になる)。数字の無い見出し(「扶養内」等)はそのまま
const normVal = (t) => {
  const m = t.match(/\d{1,3}(?:,\d{3})+(?:\.\d+)?|\d+(?:\.\d+)?/);
  return m ? m[0] : t;
};

const embedParityScene = (tool, cfg) => async () => {
  const drive = async (path, ops, resultId) => {
    const doc = await open(path);
    if (cfg.wait) await waitFor(() => doc.querySelector(cfg.wait), `${path} ${cfg.wait}`);
    for (const [op, a, b] of ops) {
      if (op === "set") set(doc, a, String(b));
      else if (op === "radio") pickRadio(doc, a, b);
      else if (op === "check") check(doc, a, b);
      else if (op === "click") click(doc, a);
    }
    click(doc, cfg.button || "calc");
    // 進捗表示の文言はウィジェットにより「計算中…」「判定中…」等 — 消えるまで待つ
    await waitFor(() => { const t = text(doc, resultId); return t && !/計算中|判定中|読み込み中/.test(t); },
      `${path} の結果`);
    const body = text(doc, resultId);
    // keyRe 指定(表・カナ変換など .big の無いページ)はそれを、無ければ可視 .big の先頭を読む
    let val, bigs = null;
    if (cfg.keyRe) {
      const m = body.match(cfg.keyRe);
      val = m ? (cfg.keyRe.global ? m.join("|") : (m[1] ?? m[0])) : null;
    } else {
      bigs = bigsIn(doc, resultId);
      val = bigs && bigs.length ? normVal(bigs[0]) : null;
    }
    return { val, bigs, body: body.slice(0, 260) };
  };
  const ops = cfg.ops || [];
  const main = await drive(`/docs/${tool}/`, [...ops, ...(cfg.mainOps || [])],
    cfg.mainResult || cfg.result || "result");
  const emb = await drive(`/docs/embed/${tool}/`, [...ops, ...(cfg.embedOps || [])],
    cfg.result || "result");
  return { mainVal: main.val, embedVal: emb.val,
           mainBigs: main.bigs, embedBigs: emb.bigs, mainBody: main.body, embedBody: emb.body };
};

// ── 地震保険料控除 (/jishin-hoken-kojo/) ───────────────────────────────────
// ★単体（tests/test_jishin_hoken_kojo.mjs）は core しか見ないので、「地震／旧長期の読み取り→
//   所得税と住民税を別の式で計算→上限の頭打ち表示→有利判定の描画」の配線はここでしか守れない。
//   期待値の手計算は同テストの §3・§7（条文書き下しオラクルと全域照合つき）。
const jishinScene = (o) => async () => {
  const doc = await open("/docs/jishin-hoken-kojo/");
  set(doc, "jishin", o.jishin ?? 30000);
  set(doc, "kyuchoki", o.kyuchoki ?? 24000);
  set(doc, "kazei", o.kazei ?? 4000000);
  if (o.both) {
    doc.getElementById("both").click();
    set(doc, "both_jishin", o.bothJishin ?? 0);
    set(doc, "both_kyuchoki", o.bothKyuchoki ?? 0);
  }
  click(doc, "calc"); // ← 参照データの到着を待たずに押す（実ユーザーと同じ）

  await waitFor(
    () => /¥|読み込めませんでした|入力してください/.test(text(doc, "result")),
    "地震保険料控除の計算結果",
  );
  const body = text(doc, "result");
  const num = (re) => { const m = body.match(re); return m ? Number(m[1].replace(/,/g, "")) : null; };
  const rows = [...(doc.querySelectorAll("#result table tr") || [])].map((tr) =>
    [...tr.querySelectorAll("th,td")].map((e) => e.textContent.trim()));
  // ★セル内の数字を全部つなげてはいけない。頭打ちのときは「¥50,000（¥65,000 が上限¥50,000で…）」
  //   のように1セルに3つの金額が出るので、**最初の ¥ の金額＝その行の答え**だけを読む。
  const cell = (label) => {
    const r = rows.find((x) => x[0] === label);
    if (!r) return null;
    const m = r[1].match(/¥([\d,]+)/);
    return m ? Number(m[1].replace(/,/g, "")) : null;
  };
  // 出典ノート（データから描く年分・上限）が実際に描かれているか
  const srcHint = text(doc, "src-hint");
  return {
    shotokuKojo: cell("所得税の控除額"),
    juminKojo: cell("住民税の控除額"),
    shotokuGen: cell("所得税の減少"),
    fukkoGen: cell("復興特別所得税の減少"),
    juminGen: cell("住民税の減少"),
    setsuzei: cell("年間の節税額"),
    // 内訳（区分ごと）— 所得税と住民税を別の式で出していることの証拠
    uchiwakeJishinShotoku: num(/地震保険料 → 所得税¥([\d,]+)/),
    uchiwakeJishinJumin: num(/地震保険料 → 所得税¥[\d,]+／住民税¥([\d,]+)/),
    uchiwakeKyuShotoku: num(/旧長期損害保険料 → 所得税¥([\d,]+)/),
    capNote: /上限に達しているため/.test(body),
    choiceShown: /で申告した方が得です/.test(body),
    choiceLabel: (body.match(/その契約は「(.+?)」で申告した方が得です/) || [])[1] || null,
    choiceDiff: num(/¥([\d,]+)の差があります/),
    srcHasYear: /令和8年分/.test(srcHint),
    srcHasMax: /5万円/.test(srcHint) && /2\.5万円|2万5/.test(srcHint),
    failed: body.includes("読み込めませんでした"),
    noInput: body.includes("入力してください"),
    body,
  };
};
