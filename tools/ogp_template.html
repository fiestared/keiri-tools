<!-- ★フォントは "Hiragino Sans" を先頭に置く。-apple-system は headless Chromium で
     和文の太いウェイトに解決されず、font-weight:800 を指定しても細く出る
     （2026-08-13 実測: 指定を変えただけで見出しの太さが元画像と揃い、
      span 境界に出ていた不自然な空きも消えた）。-->
<!doctype html><html lang="ja"><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:#f5f7f9;color:#16202b;border-left:16px solid #247762}
.canvas{height:100%;padding:164px 68px 52px}
.brand{color:#247762;font-size:30px;font-weight:800;letter-spacing:.02em;margin-bottom:34px}
.headline{font-size:55px;font-weight:800;line-height:1.32;letter-spacing:-.025em;margin:0;white-space:nowrap}
.accent{color:#247762}
.sub{margin-top:28px;color:#52667d;font-size:28px;letter-spacing:.01em}
.foot{position:absolute;left:84px;bottom:52px;color:#71859a;font-size:25px}
.foot span{margin-left:26px}
</style><body><main class="canvas">
<div class="brand">税金・経理・補助金ツールズ</div>
<h1 class="headline">税金・給与・社会保険・補助金を<br><span class="accent">その場で調べて計算</span>できる無料ツール</h1>
<div class="sub">公的な一次情報を確認し、制度改定にも対応</div>
<div class="foot">keiri-tools.com <span>登録不要・入力したデータは送信されません</span></div>
</main></body></html>
